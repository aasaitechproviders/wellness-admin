<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Allergies · KRISHA PURE Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=DM+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="css/admin.css"/></head><body>
<script src="js/api.js"></script><script>Auth.guardMenu('allergies');</script>
<script src="js/sidebar.js"></script>
<script>
const content = renderShell({
  active: 'allergies',
  title: 'Allergies',
  sub: 'Allergy options shown during customer profile setup — used for product exclusion in basket generation',
  actions: `<button class="btn btn-primary" onclick="openModal()">+ Add Allergy</button>`
});

let items = [], editId = null;

content.innerHTML = `
<div class="panel">
  <div class="toolbar">
    <input type="search" id="srch" placeholder="Search…" oninput="render()"/>
    <div class="spacer"></div>
    <span id="cnt" class="muted" style="font-size:12px"></span>
  </div>
  <div class="table-wrap"><table class="data">
    <thead><tr>
      <th>Name</th><th>Category</th><th>Severity</th><th>Aliases</th><th>Active</th><th></th>
    </tr></thead>
    <tbody id="tbody"></tbody>
  </table></div>
</div>

<div class="modal-backdrop" id="modal" style="display:none" onclick="if(event.target===this)closeModal()">
<div class="modal"><div class="modal-head"><h3 id="mTitle">Add Allergy</h3><button class="modal-close" onclick="closeModal()">✕</button></div>
<div class="form-grid" style="padding:4px 0 12px">
  <div class="field"><label>Allergy Name *</label><input id="fName" placeholder="Peanut Allergy"/></div>
  <div class="field"><label>Category</label><select id="fCategory">
    <option value="">— Select —</option>
    <option>Nuts</option><option>Dairy</option><option>Gluten</option><option>Seafood</option>
    <option>Eggs</option><option>Soy</option><option>Fruits</option><option>Vegetables</option><option>Other</option>
  </select></div>
  <div class="field"><label>Severity</label><select id="fSeverity">
    <option value="">— Select —</option>
    <option>Mild</option><option>Moderate</option><option>Severe</option>
  </select></div>
  <div class="field"><label>Aliases <span class="opt">comma-separated alternate names</span></label><input id="fAliases" placeholder="Groundnut, Monkey nut"/></div>
  <div class="field"><label>Active</label><select id="fIsActive"><option value="true">Yes</option><option value="false">No</option></select></div>
  <div class="field full"><label>Description <span class="opt">(shown to customer)</span></label><textarea id="fDescription" rows="2" placeholder="Avoid all foods containing peanuts…"></textarea></div>
  <div class="field full"><label>Nutritionist Notes <span class="opt">(internal)</span></label><textarea id="fNutritionistNotes" rows="2"></textarea></div>
</div>
<div class="modal-foot"><button class="btn btn-ghost" onclick="closeModal()">Cancel</button><button class="btn btn-primary" onclick="save()">Save</button></div>
</div></div>`;

async function load() {
  document.getElementById('tbody').innerHTML = '<tr><td colspan="6" class="loading-row"><span class="spinner"></span></td></tr>';
  try {
    const d = await adminApi.getAllergies();
    items = d.allergies || d.items || [];
    render();
  } catch(e) { showToast(e.message, 'error'); }
}

function render() {
  const q = (document.getElementById('srch').value||'').toLowerCase();
  const f = items.filter(i => !q || JSON.stringify(i).toLowerCase().includes(q));
  document.getElementById('cnt').textContent = `${f.length} allergies`;
  document.getElementById('tbody').innerHTML = f.map(i => `<tr>
    <td><b>${escapeHtml(i.name||'')}</b></td>
    <td style="font-size:12px">${escapeHtml(i.category||'–')}</td>
    <td><span class="pill ${i.severity==='Severe'?'pill-warn':i.severity==='Moderate'?'pill-placed':'pill-inactive'}">${escapeHtml(i.severity||'–')}</span></td>
    <td style="font-size:12px;color:var(--ink-soft)">${(i.aliases||[]).join(', ')||'–'}</td>
    <td><span class="pill ${i.isActive?'pill-active':'pill-inactive'}">${i.isActive?'Yes':'No'}</span></td>
    <td>
      <button class="btn btn-ghost btn-sm" onclick='openModal(${JSON.stringify(i)})'>Edit</button>
      <button class="btn btn-danger btn-sm" onclick="del('${i._id}')">Del</button>
    </td>
  </tr>`).join('') || '<tr><td colspan="6" class="empty">No allergies found.</td></tr>';
}

function openModal(i) {
  editId = i ? i._id : null;
  document.getElementById('mTitle').textContent = i ? 'Edit Allergy' : 'Add Allergy';
  document.getElementById('fName').value             = i?.name || '';
  document.getElementById('fCategory').value         = i?.category || '';
  document.getElementById('fSeverity').value         = i?.severity || '';
  document.getElementById('fAliases').value          = (i?.aliases||[]).join(', ');
  document.getElementById('fIsActive').value         = i?.isActive === false ? 'false' : 'true';
  document.getElementById('fDescription').value      = i?.description || '';
  document.getElementById('fNutritionistNotes').value= i?.nutritionistNotes || '';
  document.getElementById('modal').style.display = 'flex';
}
function closeModal() { document.getElementById('modal').style.display = 'none'; editId = null; }
function g(id) { const v = document.getElementById(id)?.value; return (v===''||v===undefined) ? null : v; }

async function save() {
  const name = g('fName');
  if (!name) { showToast('Allergy name is required', 'error'); return; }
  const aliasesRaw = document.getElementById('fAliases').value;
  const aliases = aliasesRaw ? aliasesRaw.split(',').map(s=>s.trim()).filter(Boolean) : [];
  const body = {
    name,
    category:          g('fCategory'),
    severity:          g('fSeverity'),
    aliases,
    isActive:          document.getElementById('fIsActive').value === 'true',
    description:       g('fDescription'),
    nutritionistNotes: g('fNutritionistNotes'),
  };
  try {
    if (editId) await adminApi.updateAllergen(editId, body);
    else        await adminApi.createAllergen(body);
    showToast(editId ? 'Updated' : 'Created', 'success');
    closeModal(); load();
  } catch(e) { showToast(e.message, 'error'); }
}

async function del(id) {
  if (!confirm('Delete this allergy?')) return;
  try { await adminApi.deleteAllergen(id); showToast('Deleted', 'success'); load(); }
  catch(e) { showToast(e.message, 'error'); }
}
load();
</script></body></html>
