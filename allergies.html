<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Allergies · KRISHA PURE Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=DM+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="css/admin.css"/></head><body>
<script src="js/api.js"></script><script>Auth.guardMenu('allergies');</script>
<script src="js/sidebar.js"></script>
<script>
const content = renderShell({
  active: 'allergies',
  title: 'Allergies',
  sub: 'Admin-curated allergen list shown to customers during profile setup',
  actions: `<button class="btn btn-primary" onclick="openModal()">+ Add Allergen</button>`
});

let items = [], editId = null;



content.innerHTML = `
<div id="statsBar"></div>
<div class="panel">
  <div class="toolbar">
    <input type="search" id="srch" placeholder="Search allergens…" oninput="render()"/>
    <select id="catFilter" onchange="render()">
      <option value="">All Categories</option>
      ${CATEGORIES.map(c => `<option>${c}</option>`).join('')}
    </select>
    <div class="spacer"></div>
    <span id="cnt" class="muted" style="font-size:12px"></span>
  </div>
  <div class="table-wrap"><table class="data">
    <thead><tr>
      <th>Allergen Name</th><th>Category</th><th>Common Names</th>
      <th>Severity</th><th>Description</th><th>Active</th><th></th>
    </tr></thead>
    <tbody id="tbody"></tbody>
  </table></div>
</div>

<div class="modal-backdrop" id="modal" style="display:none" onclick="if(event.target===this)closeModal()">
<div class="modal wide"><div class="modal-head"><h3 id="mTitle">Add Allergen</h3><button class="modal-close" onclick="closeModal()">✕</button></div>
<div class="form-grid" style="padding:4px 0 12px">
  <div class="field full"><label>Allergy Name *</label><input id="fName" placeholder="e.g. Peanut Allergy"/></div>
  <div class="field full"><label>Description <span class="opt">(shown to customer)</span></label>
    <textarea id="fDesc" rows="3" placeholder="e.g. Avoid all foods containing peanuts or groundnuts including peanut butter, mixed nuts, etc."></textarea>
  </div>
  <div class="field full"><label>Products to Avoid <span class="opt">(comma separated product names)</span></label>
    <textarea id="fProducts" rows="3" placeholder="e.g. Peanuts, Groundnuts, Peanut oil, Mixed nuts"></textarea>
  </div>
</div>
<div class="modal-foot"><button class="btn btn-ghost" onclick="closeModal()">Cancel</button><button class="btn btn-primary" onclick="save()">Save</button></div>
</div></div>`;

function renderStats(items) {
  if (!items || !items.length) return;
  const el = document.getElementById('statsBar');
  if (!el) return;
  el.innerHTML = `<div style="display:flex;gap:14px;padding:12px 16px;background:#fff;border:1px solid var(--border);border-radius:10px;margin-bottom:14px;flex-wrap:wrap;align-items:center">
    <div style="display:flex;flex-direction:column;align-items:center;min-width:44px">
      <span style="font-family:var(--font-mono);font-size:22px;font-weight:700;color:var(--green);line-height:1">${items.length}</span>
      <span style="font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--ink-faint);margin-top:2px">Total</span>
    </div>
    <div style="width:1px;background:var(--border);align-self:stretch;min-height:32px"></div>
    <div style="display:flex;flex-direction:column;align-items:center;min-width:44px">
      <span style="font-family:var(--font-mono);font-size:22px;font-weight:700;color:var(--green-dark);line-height:1">${items.filter(i=>i.isActive).length}</span>
      <span style="font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--ink-faint);margin-top:2px">Active</span>
    </div>
  </div>`;
}

async function load() {
  document.getElementById('tbody').innerHTML = '<tr><td colspan="7" class="loading-row"><span class="spinner"></span></td></tr>';
  try {
    const d = await adminApi.getAllergies();
    items = d.allergies || [];
    renderStats(items);
    render();
  } catch(e) { showToast(e.message, 'error'); }
}

function render() {
  const q = (document.getElementById('srch').value || '').toLowerCase();
  const cat = document.getElementById('catFilter').value;
  const f = items.filter(i => {
    if (cat && i.category !== cat) return false;
    if (q && !JSON.stringify(i).toLowerCase().includes(q)) return false;
    return true;
  });
  document.getElementById('cnt').textContent = `${f.length} allergens`;
  document.getElementById('tbody').innerHTML = f.map(i => `<tr>
    <td><b>${escapeHtml(i.name || '')}</b></td>
    <td style="font-size:12px;max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${escapeHtml(i.description || '')}</td>
    <td style="font-size:11px;color:var(--ink-soft);max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${escapeHtml((i.productsToAvoid || []).join(', '))}</td>
    <td><span class="pill ${i.isActive ? 'pill-active' : 'pill-inactive'}">${i.isActive ? 'Yes' : 'No'}</span></td>
    <td>
      <button class="btn btn-ghost btn-sm" onclick='openModal(${JSON.stringify(i)})'>Edit</button>
      <button class="btn btn-danger btn-sm" onclick="del('${i._id}')">Del</button>
    </td>
  </tr>`).join('') || '<tr><td colspan="7" class="empty">No allergens found</td></tr>';
}

function openModal(i) {
  editId = i ? i._id : null;
  document.getElementById('mTitle').textContent = i ? 'Edit Allergen' : 'Add Allergen';
  document.getElementById('fName').value     = i?.name || '';
  document.getElementById('fDesc').value     = i?.description || '';
  document.getElementById('fProducts').value = (i?.productsToAvoid || []).join(', ');
  document.getElementById('modal').style.display = 'flex';
}
function closeModal() { document.getElementById('modal').style.display = 'none'; editId = null; }
function g(id) { const v = document.getElementById(id)?.value; return (v === '' || v === undefined) ? null : v; }

async function save() {
  const name = g('fName');
  if (!name) { showToast('Allergen name required', 'error'); return; }
  const body = {
    name,
    description:      g('fDesc'),
    productsToAvoid:  (g('fProducts') || '').split(',').map(s => s.trim()).filter(Boolean),
    isActive:         true,
  };
  try {
    if (editId) await adminApi.updateAllergen(editId, body);
    else        await adminApi.createAllergen(body);
    showToast(editId ? 'Updated' : 'Created', 'success');
    closeModal(); load();
  } catch(e) { showToast(e.message, 'error'); }
}

async function del(id) {
  if (!confirm('Delete this allergen?')) return;
  try { await adminApi.deleteAllergen(id); showToast('Deleted', 'success'); load(); }
  catch(e) { showToast(e.message, 'error'); }
}

load();
</script></body></html>
