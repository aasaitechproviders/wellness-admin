<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>BMI Rules · KRISHA PURE Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=DM+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="css/admin.css"/></head><body>
<script src="js/api.js"></script><script>Auth.guardMenu('bmi-rules');</script>
<script src="js/sidebar.js"></script>
<script>
const content = renderShell({
  active: 'bmi-rules',
  title: 'BMI Rules',
  sub: 'BMI bracket definitions with recommended wellness goals, baskets and macro targets',
  actions: `<button class="btn btn-primary" onclick="openModal()">+ Add Rule</button>`
});

let items = [], editId = null;

content.innerHTML = `
<div class="panel">
  <div class="toolbar">
    <input type="search" id="srch" placeholder="Search…" oninput="render()"/>
    <div class="spacer"></div>
    <span id="cnt" class="muted" style="font-size:12px"></span>
  </div>
  <div class="table-wrap"><table class="data">
    <thead><tr>
      <th>Code</th><th>Category</th><th>BMI Range</th><th>Age Group</th><th>Rec Goal</th><th>Rec Basket</th><th>Clinical</th><th>Active</th><th></th>
    </tr></thead>
    <tbody id="tbody"></tbody>
  </table></div>
</div>

<div class="modal-backdrop" id="modal" style="display:none" onclick="if(event.target===this)closeModal()">
<div class="modal wide"><div class="modal-head"><h3 id="mTitle">Add BMI Rule</h3><button class="modal-close" onclick="closeModal()">✕</button></div>
<div style="overflow-y:auto;max-height:68vh"><div class="form-grid">

  <div class="field"><label>BMI Rule Code</label><input id="fBmiRuleCode" placeholder="BMI001"/></div>
  <div class="field"><label>BMI Category *</label><input id="fBmiCategory" placeholder="Healthy Weight"/></div>
  <div class="field"><label>BMI Min</label><input id="fBmiMin" type="number" step="0.01" placeholder="18.5"/></div>
  <div class="field"><label>BMI Max</label><input id="fBmiMax" type="number" step="0.01" placeholder="22.99"/></div>
  <div class="field"><label>Age Group</label><input id="fAgeGroup" placeholder="Adult"/></div>
  <div class="field"><label>Gender Applicable</label><select id="fGenderApplicable"><option>All</option><option>Female</option><option>Male</option></select></div>
  <div class="field"><label>WHO Classification</label><input id="fWhoClassification" placeholder="Healthy (Asian)"/></div>
  <div class="field"><label>Clinical Risk</label><input id="fClinicalRisk" placeholder="Low"/></div>
  <div class="field"><label>Waist Circumference Risk</label><input id="fWaistCircumferenceRisk" placeholder="Normal"/></div>
  <div class="field"><label>Body Fat Assessment</label><input id="fBodyFatAssessment" placeholder="Normal"/></div>
  <div class="field"><label>Recommended Wellness Goal</label><input id="fRecommendedWellnessGoal" placeholder="Weight Maintenance"/></div>
  <div class="field"><label>Recommended Basket</label><input id="fRecommendedBasket" placeholder="CB001"/></div>
  <div class="field"><label>Calorie Adjustment</label><input id="fCalorieAdjustment" placeholder="Maintain"/></div>
  <div class="field"><label>Energy Adjustment %</label><input id="fEnergyAdjustmentPct" placeholder="0%"/></div>

  <div class="field full" style="border-top:1px solid var(--border);padding-top:12px;margin-top:4px">
    <label style="font-weight:700;font-size:13px">Macros</label>
  </div>
  <div class="field"><label>Protein (g/kg)</label><input id="fProteinGPerKg" placeholder="1.0-1.2"/></div>
  <div class="field"><label>Carbohydrate (%)</label><input id="fCarbohydratePct" placeholder="50"/></div>
  <div class="field"><label>Fat (%)</label><input id="fFatPct" placeholder="30"/></div>
  <div class="field"><label>Fibre (g/day)</label><input id="fFibreGPerDay" placeholder="25"/></div>
  <div class="field"><label>Water (mL/day)</label><input id="fWaterMlPerDay" placeholder="2500"/></div>
  <div class="field"><label>Meal Frequency</label><input id="fMealFrequency" placeholder="3 Meals + 2 Snacks"/></div>

  <div class="field full" style="border-top:1px solid var(--border);padding-top:12px;margin-top:4px">
    <label style="font-weight:700;font-size:13px">Clinical Config</label>
  </div>
  <div class="field"><label>Recommended Activity Level</label><input id="fRecommendedActivityLevel" placeholder="ACT003"/></div>
  <div class="field"><label>Nutritionist Review Trigger</label><select id="fNutritionistReviewTrigger"><option>No</option><option>Yes</option><option>Conditional</option></select></div>
  <div class="field"><label>Medical Referral Trigger</label><select id="fMedicalReferralTrigger"><option>No</option><option>Yes</option><option>Conditional</option></select></div>
  <div class="field"><label>Follow Up Frequency</label><input id="fFollowUpFrequency" placeholder="Monthly"/></div>
  <div class="field"><label>Priority</label><select id="fPriority"><option>Highest</option><option>High</option><option>Medium</option><option>Low</option></select></div>
  <div class="field"><label>Auto Apply</label><select id="fAutoApply"><option>Yes</option><option>No</option><option>Conditional</option></select></div>
  <div class="field"><label>Clinical Review Required</label><select id="fClinicalReviewRequired"><option>No</option><option>Yes</option><option>Conditional</option></select></div>
  <div class="field"><label>Rule Status</label><select id="fRuleStatus"><option>Approved</option><option>Pending</option><option>Inactive</option></select></div>
  <div class="field"><label>Nutritionist Approved</label><select id="fNutritionistApproved"><option value="Yes">Yes</option><option value="No">No</option></select></div>
  <div class="field"><label>Reference Guideline</label><input id="fReferenceGuideline" placeholder="WHO Asia-Pacific"/></div>
  <div class="field"><label>Active</label><select id="fIsActive"><option value="true">Yes</option><option value="false">No</option></select></div>
  <div class="field full"><label>Nutritionist Comments</label><textarea id="fNutritionistComments" rows="2"></textarea></div>
</div></div>
<div class="modal-foot"><button class="btn btn-ghost" onclick="closeModal()">Cancel</button><button class="btn btn-primary" onclick="save()">Save</button></div>
</div></div>`;

async function load() {
  document.getElementById('tbody').innerHTML = '<tr><td colspan="9" class="loading-row"><span class="spinner"></span></td></tr>';
  try {
    const d = await adminApi.getBmiRules();
    items = (d.bmiRules || d.items || []).sort((a,b)=>(a.bmiMin||0)-(b.bmiMin||0));
    render();
  } catch(e) { showToast(e.message, 'error'); }
}

function render() {
  const q = (document.getElementById('srch').value||'').toLowerCase();
  const f = items.filter(i => !q || JSON.stringify(i).toLowerCase().includes(q));
  document.getElementById('cnt').textContent = `${f.length} rules`;
  document.getElementById('tbody').innerHTML = f.map(i => `<tr>
    <td class="mono" style="font-size:12px">${escapeHtml(i.bmiRuleCode||'')}</td>
    <td><b>${escapeHtml(i.bmiCategory||'')}</b></td>
    <td class="mono" style="font-size:12px">${i.bmiMin??'–'} – ${i.bmiMax??'–'}</td>
    <td style="font-size:12px">${escapeHtml(i.ageGroup||'')}</td>
    <td style="font-size:12px">${escapeHtml(i.recommendedWellnessGoal||'–')}</td>
    <td class="mono" style="font-size:12px">${escapeHtml(i.recommendedBasket||'–')}</td>
    <td><span class="pill ${i.clinicalReviewRequired==='Yes'?'pill-warn':i.clinicalReviewRequired==='Conditional'?'pill-placed':'pill-inactive'}">${escapeHtml(i.clinicalReviewRequired||'No')}</span></td>
    <td><span class="pill ${i.isActive?'pill-active':'pill-inactive'}">${i.isActive?'Yes':'No'}</span></td>
    <td>
      <button class="btn btn-ghost btn-sm" onclick='openModal(${JSON.stringify(i)})'>Edit</button>
      <button class="btn btn-danger btn-sm" onclick="del('${i._id}')">Del</button>
    </td>
  </tr>`).join('') || '<tr><td colspan="9" class="empty">No BMI rules found.</td></tr>';
}

function openModal(i) {
  editId = i ? i._id : null;
  document.getElementById('mTitle').textContent = i ? 'Edit BMI Rule' : 'Add BMI Rule';
  document.getElementById('fBmiRuleCode').value              = i?.bmiRuleCode || '';
  document.getElementById('fBmiCategory').value              = i?.bmiCategory || '';
  document.getElementById('fBmiMin').value                   = i?.bmiMin ?? '';
  document.getElementById('fBmiMax').value                   = i?.bmiMax ?? '';
  document.getElementById('fAgeGroup').value                 = i?.ageGroup || '';
  document.getElementById('fGenderApplicable').value         = i?.genderApplicable || 'All';
  document.getElementById('fWhoClassification').value        = i?.whoClassification || '';
  document.getElementById('fClinicalRisk').value             = i?.clinicalRisk || '';
  document.getElementById('fWaistCircumferenceRisk').value   = i?.waistCircumferenceRisk || '';
  document.getElementById('fBodyFatAssessment').value        = i?.bodyFatAssessment || '';
  document.getElementById('fRecommendedWellnessGoal').value  = i?.recommendedWellnessGoal || '';
  document.getElementById('fRecommendedBasket').value        = i?.recommendedBasket || '';
  document.getElementById('fCalorieAdjustment').value        = i?.calorieAdjustment || '';
  document.getElementById('fEnergyAdjustmentPct').value      = i?.energyAdjustmentPct || '';
  document.getElementById('fProteinGPerKg').value            = i?.macros?.proteinGPerKg || '';
  document.getElementById('fCarbohydratePct').value          = i?.macros?.carbohydratePct || '';
  document.getElementById('fFatPct').value                   = i?.macros?.fatPct || '';
  document.getElementById('fFibreGPerDay').value             = i?.macros?.fibreGPerDay || '';
  document.getElementById('fWaterMlPerDay').value            = i?.macros?.waterMlPerDay || '';
  document.getElementById('fMealFrequency').value            = i?.mealFrequency || '';
  document.getElementById('fRecommendedActivityLevel').value = i?.recommendedActivityLevel || '';
  document.getElementById('fNutritionistReviewTrigger').value= i?.nutritionistReviewTrigger || 'No';
  document.getElementById('fMedicalReferralTrigger').value   = i?.medicalReferralTrigger || 'No';
  document.getElementById('fFollowUpFrequency').value        = i?.followUpFrequency || '';
  document.getElementById('fPriority').value                 = i?.priority || 'Medium';
  document.getElementById('fAutoApply').value                = i?.autoApply || 'Conditional';
  document.getElementById('fClinicalReviewRequired').value   = i?.clinicalReviewRequired || 'No';
  document.getElementById('fRuleStatus').value               = i?.ruleStatus || 'Approved';
  document.getElementById('fNutritionistApproved').value     = i?.nutritionistApproved || 'Yes';
  document.getElementById('fReferenceGuideline').value       = i?.referenceGuideline || '';
  document.getElementById('fIsActive').value                 = i?.isActive === false ? 'false' : 'true';
  document.getElementById('fNutritionistComments').value     = i?.nutritionistComments || '';
  document.getElementById('modal').style.display = 'flex';
}
function closeModal() { document.getElementById('modal').style.display = 'none'; editId = null; }
function g(id) { const v = document.getElementById(id)?.value; return (v===''||v===undefined) ? null : v; }
function gn(id) { const v = parseFloat(document.getElementById(id)?.value); return isNaN(v) ? null : v; }

async function save() {
  const bmiCategory = g('fBmiCategory');
  if (!bmiCategory) { showToast('BMI Category is required', 'error'); return; }
  const body = {
    bmiRuleCode:               g('fBmiRuleCode'),
    bmiCategory,
    bmiMin:                    gn('fBmiMin'),
    bmiMax:                    gn('fBmiMax'),
    ageGroup:                  g('fAgeGroup'),
    genderApplicable:          g('fGenderApplicable'),
    whoClassification:         g('fWhoClassification'),
    clinicalRisk:              g('fClinicalRisk'),
    waistCircumferenceRisk:    g('fWaistCircumferenceRisk'),
    bodyFatAssessment:         g('fBodyFatAssessment'),
    recommendedWellnessGoal:   g('fRecommendedWellnessGoal'),
    recommendedBasket:         g('fRecommendedBasket'),
    calorieAdjustment:         g('fCalorieAdjustment'),
    energyAdjustmentPct:       g('fEnergyAdjustmentPct'),
    macros: {
      proteinGPerKg:    g('fProteinGPerKg'),
      carbohydratePct:  g('fCarbohydratePct'),
      fatPct:           g('fFatPct'),
      fibreGPerDay:     g('fFibreGPerDay'),
      waterMlPerDay:    g('fWaterMlPerDay'),
    },
    mealFrequency:             g('fMealFrequency'),
    recommendedActivityLevel:  g('fRecommendedActivityLevel'),
    nutritionistReviewTrigger: g('fNutritionistReviewTrigger'),
    medicalReferralTrigger:    g('fMedicalReferralTrigger'),
    followUpFrequency:         g('fFollowUpFrequency'),
    priority:                  g('fPriority'),
    autoApply:                 g('fAutoApply'),
    clinicalReviewRequired:    g('fClinicalReviewRequired'),
    ruleStatus:                g('fRuleStatus'),
    nutritionistApproved:      g('fNutritionistApproved'),
    referenceGuideline:        g('fReferenceGuideline'),
    isActive:                  document.getElementById('fIsActive').value === 'true',
    nutritionistComments:      g('fNutritionistComments'),
  };
  try {
    if (editId) await adminApi.updateBmiRule(editId, body);
    else        await adminApi.createBmiRule(body);
    showToast(editId ? 'Updated' : 'Created', 'success');
    closeModal(); load();
  } catch(e) { showToast(e.message, 'error'); }
}

async function del(id) {
  if (!confirm('Delete this BMI rule?')) return;
  try { await adminApi.deleteBmiRule(id); showToast('Deleted', 'success'); load(); }
  catch(e) { showToast(e.message, 'error'); }
}
load();
</script></body></html>
