<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>BMI Rules · KRISHA PURE Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=DM+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="css/admin.css"/></head><body>
<script src="js/api.js"></script><script>Auth.guardMenu('bmi-rules');</script><script src="js/sidebar.js"></script>
<script>
const content=renderShell({active:'bmi-rules',title:'BMI Rules',sub:'10 BMI category rules mapping weight classifications to nutrition targets and baskets',actions:`<button class="btn btn-primary" onclick="openModal()">+ Add</button>`});
let items=[],editId=null;
content.innerHTML=`<div class="panel">
<div class="toolbar"><input type="search" id="srch" placeholder="Search…" oninput="render()"/><div class="spacer"></div><span id="cnt" class="muted" style="font-size:12px"></span></div>
<div class="table-wrap"><table class="data"><thead><tr><th>Code</th><th>BMI Category</th><th>Range</th><th>Clinical Risk</th><th>Recommended Basket</th><th>Calorie Adj.</th><th>Priority</th><th>Status</th><th></th></tr></thead><tbody id="tbody"></tbody></table></div></div>
<div class="modal-backdrop" id="modal" style="display:none" onclick="if(event.target===this)closeModal()">
<div class="modal wide"><div class="modal-head"><h3 id="mTitle">Add BMI Rule</h3><button class="modal-close" onclick="closeModal()">✕</button></div>
<div style="overflow-y:auto;max-height:68vh"><div class="form-grid">
  <div class="field"><label>BMI Rule Code</label><input id="fCode" placeholder="BMI001"/></div>
  <div class="field"><label>BMI Category *</label><input id="fCat" placeholder="Healthy Weight"/></div>
  <div class="field"><label>BMI Min</label><input id="fMin" type="number" step="0.01" placeholder="18.5"/></div>
  <div class="field"><label>BMI Max</label><input id="fMax" type="number" step="0.01" placeholder="22.99"/></div>
  <div class="field"><label>Age Group</label><input id="fAge" placeholder="Adult"/></div>
  <div class="field"><label>Gender Applicable</label><select id="fGender"><option>All</option><option>Female</option><option>Male</option></select></div>
  <div class="field"><label>WHO Classification</label><input id="fWHO" placeholder="Healthy (Asian)"/></div>
  <div class="field"><label>Clinical Risk</label><input id="fRisk" placeholder="Low"/></div>
  <div class="field"><label>Recommended Wellness Goal</label><input id="fGoal" placeholder="Weight Maintenance"/></div>
  <div class="field"><label>Recommended Basket</label><input id="fBasket" placeholder="CB001"/></div>
  <div class="field"><label>Calorie Adjustment</label><input id="fCalAdj" placeholder="Maintain"/></div>
  <div class="field"><label>Energy Adjustment (%)</label><input id="fEnergy" placeholder="0%"/></div>
  <div class="field"><label>Protein (g/kg)</label><input id="fProt" placeholder="1.0-1.2"/></div>
  <div class="field"><label>Carbohydrate (%)</label><input id="fCarb" type="number" placeholder="50"/></div>
  <div class="field"><label>Fat (%)</label><input id="fFat" type="number" placeholder="30"/></div>
  <div class="field"><label>Fibre (g/day)</label><input id="fFibre" type="number" placeholder="25"/></div>
  <div class="field"><label>Water (mL/day)</label><input id="fWater" type="number" placeholder="2500"/></div>
  <div class="field"><label>Meal Frequency</label><input id="fMeal" placeholder="3 Meals + 2 Snacks"/></div>
  <div class="field"><label>Recommended Activity Level</label><input id="fAct" placeholder="ACT003"/></div>
  <div class="field"><label>Priority</label><select id="fPri"><option>Highest</option><option>High</option><option>Medium</option><option>Low</option></select></div>
  <div class="field"><label>Auto Apply</label><select id="fAuto"><option>Yes</option><option>No</option></select></div>
  <div class="field"><label>Clinical Review Required</label><select id="fClin"><option>No</option><option>Yes</option><option>Conditional</option></select></div>
  <div class="field"><label>Rule Status</label><select id="fStatus"><option>Approved</option><option>Pending</option></select></div>
  <div class="field"><label>Reference Guideline</label><input id="fRef" placeholder="WHO Asia-Pacific"/></div>
  <div class="field full"><label>Nutritionist Comments</label><textarea id="fComments" rows="2"></textarea></div>
</div></div>
<div class="modal-foot"><button class="btn btn-ghost" onclick="closeModal()">Cancel</button><button class="btn btn-primary" onclick="save()">Save</button></div>
</div></div>`;

async function load(){
  document.getElementById('tbody').innerHTML='<tr><td colspan="9" class="loading-row"><span class="spinner"></span></td></tr>';
  try{const d=await adminApi.getBmiRules();items=d.bmiRules||[];render();}catch(e){showToast(e.message,'error');}
}
function render(){
  const q=(document.getElementById('srch').value||'').toLowerCase();
  const f=items.filter(i=>!q||JSON.stringify(i).toLowerCase().includes(q));
  document.getElementById('cnt').textContent=`${f.length} records`;
  document.getElementById('tbody').innerHTML=f.map(i=>`<tr>
    <td class="mono">${escapeHtml(i.bmiRuleCode||'')}</td><td><b>${escapeHtml(i.bmiCategory||'')}</b></td>
    <td class="mono">${i.bmiMin??''}–${i.bmiMax??''}</td><td>${escapeHtml(i.clinicalRisk||'')}</td>
    <td class="mono">${escapeHtml(i.recommendedBasket||'–')}</td><td>${escapeHtml(i.calorieAdjustment||'')}</td>
    <td>${escapeHtml(i.priority||'')}</td>
    <td><span class="pill ${i.isActive?'pill-active':'pill-inactive'}">${escapeHtml(i.ruleStatus||'')}</span></td>
    <td><button class="btn btn-ghost btn-sm" onclick='openModal(${JSON.stringify(i)})'>Edit</button>
        <button class="btn btn-danger btn-sm" onclick="del('${i._id}')">Del</button></td>
  </tr>`).join('')||'<tr><td colspan="9" class="empty">No records</td></tr>';
}
function openModal(i){
  editId=i?i._id:null;document.getElementById('mTitle').textContent=i?'Edit BMI Rule':'Add BMI Rule';
  const m=i?.macros||{};
  document.getElementById('fCode').value=i?.bmiRuleCode||'';document.getElementById('fCat').value=i?.bmiCategory||'';
  document.getElementById('fMin').value=i?.bmiMin??'';document.getElementById('fMax').value=i?.bmiMax??'';
  document.getElementById('fAge').value=i?.ageGroup||'Adult';document.getElementById('fGender').value=i?.genderApplicable||'All';
  document.getElementById('fWHO').value=i?.whoClassification||'';document.getElementById('fRisk').value=i?.clinicalRisk||'';
  document.getElementById('fGoal').value=i?.recommendedWellnessGoal||'';document.getElementById('fBasket').value=i?.recommendedBasket||'';
  document.getElementById('fCalAdj').value=i?.calorieAdjustment||'';document.getElementById('fEnergy').value=i?.energyAdjustmentPct||'';
  document.getElementById('fProt').value=m.proteinGPerKg||'';document.getElementById('fCarb').value=m.carbohydratePct||'';
  document.getElementById('fFat').value=m.fatPct||'';document.getElementById('fFibre').value=m.fibreGPerDay||'';
  document.getElementById('fWater').value=m.waterMlPerDay||'';document.getElementById('fMeal').value=i?.mealFrequency||'';
  document.getElementById('fAct').value=i?.recommendedActivityLevel||'';document.getElementById('fPri').value=i?.priority||'Medium';
  document.getElementById('fAuto').value=i?.autoApply||'Yes';document.getElementById('fClin').value=i?.clinicalReviewRequired||'No';
  document.getElementById('fStatus').value=i?.ruleStatus||'Approved';document.getElementById('fRef').value=i?.referenceGuideline||'';
  document.getElementById('fComments').value=i?.nutritionistComments||'';
  document.getElementById('modal').style.display='flex';
}
function closeModal(){document.getElementById('modal').style.display='none';editId=null;}
function g(id){const v=document.getElementById(id)?.value;return(v===''||v===undefined)?null:v;}
function gn(id){const v=document.getElementById(id)?.value;return(v===''||v===undefined)?null:parseFloat(v);}
async function save(){
  const body={bmiRuleCode:g('fCode'),bmiCategory:g('fCat'),bmiMin:gn('fMin'),bmiMax:gn('fMax'),
    ageGroup:g('fAge'),genderApplicable:g('fGender'),whoClassification:g('fWHO'),clinicalRisk:g('fRisk'),
    recommendedWellnessGoal:g('fGoal'),recommendedBasket:g('fBasket'),calorieAdjustment:g('fCalAdj'),
    energyAdjustmentPct:g('fEnergy'),mealFrequency:g('fMeal'),recommendedActivityLevel:g('fAct'),
    priority:g('fPri'),autoApply:g('fAuto'),clinicalReviewRequired:g('fClin'),
    ruleStatus:g('fStatus'),referenceGuideline:g('fRef'),nutritionistComments:g('fComments'),
    macros:{proteinGPerKg:g('fProt'),carbohydratePct:gn('fCarb'),fatPct:gn('fFat'),fibreGPerDay:gn('fFibre'),waterMlPerDay:gn('fWater')}};
  if(!body.bmiCategory){showToast('BMI Category required','error');return;}
  try{if(editId)await adminApi.updateBmiRule(editId,body);else await adminApi.createBmiRule(body);
    showToast(editId?'Updated':'Created','success');closeModal();load();}catch(e){showToast(e.message,'error');}
}
async function del(id){if(!confirm('Delete?'))return;try{await adminApi.deleteBmiRule(id);showToast('Deleted','success');load();}catch(e){showToast(e.message,'error');}}
load();
</script></body></html>
