<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Condition Modifier Rules · KRISHA PURE Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=DM+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="css/admin.css"/></head><body>
<script src="js/api.js"></script><script>Auth.guardMenu('condition-modifier-rules');</script>
<script src="js/sidebar.js"></script>
<script>
const content = renderShell({
  active: 'condition-modifier-rules',
  title: 'Condition Modifier Rules',
  sub: 'Nutrient adjustment rules per health condition — drives energy and fibre boosts in the basket engine',
  actions: `<button class="btn btn-primary" onclick="openModal()">+ Add Rule</button>`
});

let items = [], editId = null;

content.innerHTML = `
<div class="panel">
  <div class="toolbar">
    <input type="search" id="srch" placeholder="Search…" oninput="render()"/>
    <div class="spacer"></div>
    <span id="cnt" class="muted" style="font-size:12px"></span>
  </div>
  <div class="table-wrap"><table class="data">
    <thead><tr>
      <th>Rule Code</th><th>Condition</th><th>Modifier Type</th><th>Parameter</th><th>Value</th><th>Numeric</th><th>Fibre Boost</th><th>Clinical</th><th>Active</th><th></th>
    </tr></thead>
    <tbody id="tbody"></tbody>
  </table></div>
</div>

<div class="modal-backdrop" id="modal" style="display:none" onclick="if(event.target===this)closeModal()">
<div class="modal wide"><div class="modal-head"><h3 id="mTitle">Add Condition Modifier Rule</h3><button class="modal-close" onclick="closeModal()">✕</button></div>
<div style="overflow-y:auto;max-height:68vh"><div class="form-grid">
  <div class="field"><label>Rule Code</label><input id="fRuleCode" placeholder="CMR001"/></div>
  <div class="field"><label>Condition Code *</label><input id="fConditionCode" placeholder="HC001"/></div>
  <div class="field"><label>Condition Name</label><input id="fConditionName" placeholder="Diabetes"/></div>
  <div class="field"><label>Modifier Type</label><input id="fModifierType" placeholder="Macronutrient"/></div>
  <div class="field"><label>Modifier Parameter</label><input id="fModifierParameter" placeholder="Carbohydrate"/></div>
  <div class="field"><label>Rule Value <span class="opt">display string</span></label><input id="fRuleValue" placeholder="45–50%"/></div>
  <div class="field"><label>Rule Value Numeric <span class="opt">used by engine</span></label><input id="fRuleValueNumeric" type="number" step="0.01" placeholder="47.5"/></div>
  <div class="field"><label>Unit</label><input id="fUnit" placeholder="% / g/day"/></div>
  <div class="field"><label>Adjustment Type</label><select id="fAdjustmentType"><option value="">— None —</option><option value="deficit">deficit</option><option value="surplus">surplus</option><option value="maintain">maintain</option></select></div>
  <div class="field"><label>Fibre Boost (g/day)</label><input id="fFibreBoostG" type="number" step="0.5" placeholder="5"/></div>
  <div class="field"><label>Priority</label><select id="fPriority"><option>Highest</option><option>High</option><option>Medium</option><option>Low</option></select></div>
  <div class="field"><label>Auto Apply</label><select id="fAutoApply"><option>Yes</option><option>No</option><option>Conditional</option></select></div>
  <div class="field"><label>Clinical Review Required</label><select id="fClinicalReviewRequired"><option>No</option><option>Yes</option><option>Conditional</option></select></div>
  <div class="field"><label>Rule Status</label><select id="fRuleStatus"><option>Approved</option><option>Pending</option><option>Inactive</option></select></div>
  <div class="field"><label>Active</label><select id="fIsActive"><option value="true">Yes</option><option value="false">No</option></select></div>
  <div class="field full"><label>Nutritionist Comments</label><textarea id="fNutritionistComments" rows="2"></textarea></div>
</div></div>
<div class="modal-foot"><button class="btn btn-ghost" onclick="closeModal()">Cancel</button><button class="btn btn-primary" onclick="save()">Save</button></div>
</div></div>`;

async function load() {
  document.getElementById('tbody').innerHTML = '<tr><td colspan="10" class="loading-row"><span class="spinner"></span></td></tr>';
  try {
    const d = await adminApi.getConditionModifierRules();
    items = d.items || [];
    render();
  } catch(e) { showToast(e.message, 'error'); }
}

function render() {
  const q = (document.getElementById('srch').value||'').toLowerCase();
  const f = items.filter(i => !q || JSON.stringify(i).toLowerCase().includes(q));
  document.getElementById('cnt').textContent = `${f.length} rules`;
  document.getElementById('tbody').innerHTML = f.map(i => `<tr>
    <td class="mono" style="font-size:12px">${escapeHtml(i.ruleCode||'')}</td>
    <td><b>${escapeHtml(i.conditionName||i.conditionCode||'')}</b></td>
    <td style="font-size:12px">${escapeHtml(i.modifierType||'')}</td>
    <td style="font-size:12px">${escapeHtml(i.modifierParameter||'')}</td>
    <td class="mono" style="font-size:12px">${escapeHtml(i.ruleValue||'')}</td>
    <td class="mono" style="font-size:12px">${i.ruleValueNumeric ?? '–'}</td>
    <td class="mono" style="font-size:12px">${i.fibreBoostG != null ? i.fibreBoostG+'g' : '–'}</td>
    <td><span class="pill ${i.clinicalReviewRequired==='Yes'?'pill-warn':i.clinicalReviewRequired==='Conditional'?'pill-placed':'pill-inactive'}">${escapeHtml(i.clinicalReviewRequired||'No')}</span></td>
    <td><span class="pill ${i.isActive?'pill-active':'pill-inactive'}">${i.isActive?'Yes':'No'}</span></td>
    <td>
      <button class="btn btn-ghost btn-sm" onclick='openModal(${JSON.stringify(i)})'>Edit</button>
      <button class="btn btn-danger btn-sm" onclick="del('${i._id}')">Del</button>
    </td>
  </tr>`).join('') || '<tr><td colspan="10" class="empty">No condition modifier rules found.</td></tr>';
}

function openModal(i) {
  editId = i ? i._id : null;
  document.getElementById('mTitle').textContent = i ? 'Edit Condition Modifier Rule' : 'Add Condition Modifier Rule';
  document.getElementById('fRuleCode').value              = i?.ruleCode || '';
  document.getElementById('fConditionCode').value         = i?.conditionCode || '';
  document.getElementById('fConditionName').value         = i?.conditionName || '';
  document.getElementById('fModifierType').value          = i?.modifierType || '';
  document.getElementById('fModifierParameter').value     = i?.modifierParameter || '';
  document.getElementById('fRuleValue').value             = i?.ruleValue || '';
  document.getElementById('fRuleValueNumeric').value      = i?.ruleValueNumeric ?? '';
  document.getElementById('fUnit').value                  = i?.unit || '';
  document.getElementById('fAdjustmentType').value        = i?.adjustmentType || '';
  document.getElementById('fFibreBoostG').value           = i?.fibreBoostG ?? '';
  document.getElementById('fPriority').value              = i?.priority || 'Medium';
  document.getElementById('fAutoApply').value             = i?.autoApply || 'Conditional';
  document.getElementById('fClinicalReviewRequired').value= i?.clinicalReviewRequired || 'No';
  document.getElementById('fRuleStatus').value            = i?.ruleStatus || 'Approved';
  document.getElementById('fIsActive').value              = i?.isActive === false ? 'false' : 'true';
  document.getElementById('fNutritionistComments').value  = i?.nutritionistComments || '';
  document.getElementById('modal').style.display = 'flex';
}
function closeModal() { document.getElementById('modal').style.display = 'none'; editId = null; }
function g(id) { const v = document.getElementById(id)?.value; return (v===''||v===undefined) ? null : v; }
function gn(id) { const v = parseFloat(document.getElementById(id)?.value); return isNaN(v) ? null : v; }

async function save() {
  const conditionCode = g('fConditionCode');
  if (!conditionCode) { showToast('Condition Code is required', 'error'); return; }
  const body = {
    ruleCode:               g('fRuleCode'),
    conditionCode,
    conditionName:          g('fConditionName'),
    modifierType:           g('fModifierType'),
    modifierParameter:      g('fModifierParameter'),
    ruleValue:              g('fRuleValue'),
    ruleValueNumeric:       gn('fRuleValueNumeric'),
    unit:                   g('fUnit'),
    adjustmentType:         g('fAdjustmentType') || null,
    fibreBoostG:            gn('fFibreBoostG'),
    priority:               g('fPriority'),
    autoApply:              g('fAutoApply'),
    clinicalReviewRequired: g('fClinicalReviewRequired'),
    ruleStatus:             g('fRuleStatus'),
    isActive:               document.getElementById('fIsActive').value === 'true',
    nutritionistComments:   g('fNutritionistComments'),
  };
  try {
    if (editId) await adminApi.updateConditionModifierRule(editId, body);
    else        await adminApi.createConditionModifierRule(body);
    showToast(editId ? 'Updated' : 'Created', 'success');
    closeModal(); load();
  } catch(e) { showToast(e.message, 'error'); }
}

async function del(id) {
  if (!confirm('Delete this rule?')) return;
  try { await adminApi.deleteConditionModifierRule(id); showToast('Deleted', 'success'); load(); }
  catch(e) { showToast(e.message, 'error'); }
}
load();
</script></body></html>
