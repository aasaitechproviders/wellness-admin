<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Goal Macro Rules · KRISHA PURE Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=DM+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="css/admin.css"/></head><body>
<script src="js/api.js"></script><script>Auth.guardMenu('goal-macro-rules');</script>
<script src="js/sidebar.js"></script>
<script>
const content = renderShell({
  active: 'goal-macro-rules',
  title: 'Goal Macro Rules',
  sub: 'TDEE calorie targets and macro ratios per wellness goal — drives the basket engine calorie calculations',
  actions: `<button class="btn btn-primary" onclick="openModal()">+ Add Rule</button>`
});

let items = [], editId = null;

content.innerHTML = `
<div class="panel">
  <div class="toolbar">
    <input type="search" id="srch" placeholder="Search…" oninput="render()"/>
    <div class="spacer"></div>
    <span id="cnt" class="muted" style="font-size:12px"></span>
  </div>
  <div class="table-wrap"><table class="data">
    <thead><tr>
      <th>Goal Code</th><th>Goal Name</th><th>Cal Multiplier</th><th>Min–Max Kcal</th><th>TDEE Adj%</th><th>Energy Method</th><th>Active</th><th></th>
    </tr></thead>
    <tbody id="tbody"></tbody>
  </table></div>
</div>

<div class="modal-backdrop" id="modal" style="display:none" onclick="if(event.target===this)closeModal()">
<div class="modal wide"><div class="modal-head"><h3 id="mTitle">Add Goal Macro Rule</h3><button class="modal-close" onclick="closeModal()">✕</button></div>
<div style="overflow-y:auto;max-height:68vh"><div class="form-grid">
  <div class="field"><label>Goal Code *</label><input id="fGoalCode" placeholder="WG001"/></div>
  <div class="field"><label>Goal Name</label><input id="fGoalName" placeholder="Weight Loss"/></div>

  <div class="field full" style="border-top:1px solid var(--border);padding-top:12px;margin-top:4px">
    <label style="font-weight:700;font-size:13px">Macros</label>
  </div>
  <div class="field"><label>Protein (%)</label><input id="fProteinPct" type="number" step="0.1" placeholder="30"/></div>
  <div class="field"><label>Carbohydrate (%)</label><input id="fCarbohydratePct" type="number" step="0.1" placeholder="40"/></div>
  <div class="field"><label>Fat (%)</label><input id="fFatPct" type="number" step="0.1" placeholder="30"/></div>
  <div class="field"><label>Calorie Multiplier</label><input id="fCalorieMultiplier" type="number" step="0.01" placeholder="1.0"/></div>
  <div class="field"><label>Fibre (g/day)</label><input id="fFibreGPerDay" type="number" step="0.5" placeholder="30"/></div>
  <div class="field"><label>Min Kcal/day</label><input id="fMinKcal" type="number" placeholder="1200"/></div>
  <div class="field"><label>Max Kcal/day</label><input id="fMaxKcal" type="number" placeholder="3500"/></div>
  <div class="field"><label>Water (L/day)</label><input id="fWaterLPerDay" type="number" step="0.1" placeholder="2.5"/></div>

  <div class="field full" style="border-top:1px solid var(--border);padding-top:12px;margin-top:4px">
    <label style="font-weight:700;font-size:13px">Energy Method</label>
  </div>
  <div class="field"><label>TDEE Adj %</label><input id="fTdeeAdjPct" type="number" placeholder="0"/></div>
  <div class="field"><label>Energy Method</label><input id="fEnergyMethod" placeholder="REE×PAL"/></div>
  <div class="field"><label>REE Formula</label><input id="fReeFormula" placeholder="Mifflin-St Jeor"/></div>

  <div class="field full" style="border-top:1px solid var(--border);padding-top:12px;margin-top:4px">
    <label style="font-weight:700;font-size:13px">Config</label>
  </div>
  <div class="field"><label>Rule Status</label><select id="fRuleStatus"><option>Approved</option><option>Pending</option><option>Inactive</option></select></div>
  <div class="field"><label>Active</label><select id="fIsActive"><option value="true">Yes</option><option value="false">No</option></select></div>
  <div class="field full"><label>Nutritionist Comments</label><textarea id="fNutritionistComments" rows="2"></textarea></div>
</div></div>
<div class="modal-foot"><button class="btn btn-ghost" onclick="closeModal()">Cancel</button><button class="btn btn-primary" onclick="save()">Save</button></div>
</div></div>`;

async function load() {
  document.getElementById('tbody').innerHTML = '<tr><td colspan="8" class="loading-row"><span class="spinner"></span></td></tr>';
  try {
    const d = await adminApi.getGoalMacroRules();
    items = d.items || [];
    render();
  } catch(e) { showToast(e.message, 'error'); }
}

function render() {
  const q = (document.getElementById('srch').value||'').toLowerCase();
  const f = items.filter(i => !q || JSON.stringify(i).toLowerCase().includes(q));
  document.getElementById('cnt').textContent = `${f.length} rules`;
  document.getElementById('tbody').innerHTML = f.map(i => `<tr>
    <td class="mono"><b>${escapeHtml(i.goalCode||'')}</b></td>
    <td>${escapeHtml(i.goalName||'')}</td>
    <td class="mono">${i.macros?.calorieMultiplier ?? '–'}</td>
    <td class="mono" style="font-size:12px">${i.macros?.minKcal??'–'} – ${i.macros?.maxKcal??'–'}</td>
    <td class="mono">${i.tdeeAdjPct != null ? i.tdeeAdjPct+'%' : '–'}</td>
    <td style="font-size:12px">${escapeHtml(i.energyMethod||'–')}</td>
    <td><span class="pill ${i.isActive?'pill-active':'pill-inactive'}">${i.isActive?'Yes':'No'}</span></td>
    <td>
      <button class="btn btn-ghost btn-sm" onclick='openModal(${JSON.stringify(i)})'>Edit</button>
      <button class="btn btn-danger btn-sm" onclick="del('${i._id}')">Del</button>
    </td>
  </tr>`).join('') || '<tr><td colspan="8" class="empty">No goal macro rules found.</td></tr>';
}

function openModal(i) {
  editId = i ? i._id : null;
  document.getElementById('mTitle').textContent = i ? 'Edit Goal Macro Rule' : 'Add Goal Macro Rule';
  document.getElementById('fGoalCode').value            = i?.goalCode || '';
  document.getElementById('fGoalName').value            = i?.goalName || '';
  document.getElementById('fProteinPct').value          = i?.macros?.proteinPct ?? '';
  document.getElementById('fCarbohydratePct').value     = i?.macros?.carbohydratePct ?? '';
  document.getElementById('fFatPct').value              = i?.macros?.fatPct ?? '';
  document.getElementById('fCalorieMultiplier').value   = i?.macros?.calorieMultiplier ?? '';
  document.getElementById('fFibreGPerDay').value        = i?.macros?.fibreGPerDay ?? '';
  document.getElementById('fMinKcal').value             = i?.macros?.minKcal ?? '';
  document.getElementById('fMaxKcal').value             = i?.macros?.maxKcal ?? '';
  document.getElementById('fWaterLPerDay').value        = i?.macros?.waterLPerDay ?? '';
  document.getElementById('fTdeeAdjPct').value          = i?.tdeeAdjPct ?? '';
  document.getElementById('fEnergyMethod').value        = i?.energyMethod || '';
  document.getElementById('fReeFormula').value          = i?.reeFormula || '';
  document.getElementById('fRuleStatus').value          = i?.ruleStatus || 'Approved';
  document.getElementById('fIsActive').value            = i?.isActive === false ? 'false' : 'true';
  document.getElementById('fNutritionistComments').value= i?.nutritionistComments || '';
  document.getElementById('modal').style.display = 'flex';
}
function closeModal() { document.getElementById('modal').style.display = 'none'; editId = null; }
function g(id) { const v = document.getElementById(id)?.value; return (v===''||v===undefined) ? null : v; }
function gn(id) { const v = parseFloat(document.getElementById(id)?.value); return isNaN(v) ? null : v; }
function gi(id) { const v = parseInt(document.getElementById(id)?.value); return isNaN(v) ? null : v; }

async function save() {
  const goalCode = g('fGoalCode');
  if (!goalCode) { showToast('Goal Code is required', 'error'); return; }
  const body = {
    goalCode,
    goalName:             g('fGoalName'),
    macros: {
      proteinPct:         gn('fProteinPct'),
      carbohydratePct:    gn('fCarbohydratePct'),
      fatPct:             gn('fFatPct'),
      calorieMultiplier:  gn('fCalorieMultiplier'),
      fibreGPerDay:       gn('fFibreGPerDay'),
      minKcal:            gi('fMinKcal'),
      maxKcal:            gi('fMaxKcal'),
      waterLPerDay:       gn('fWaterLPerDay'),
    },
    tdeeAdjPct:           gn('fTdeeAdjPct'),
    energyMethod:         g('fEnergyMethod'),
    reeFormula:           g('fReeFormula'),
    ruleStatus:           g('fRuleStatus'),
    isActive:             document.getElementById('fIsActive').value === 'true',
    nutritionistComments: g('fNutritionistComments'),
  };
  try {
    if (editId) await adminApi.updateGoalMacroRule(editId, body);
    else        await adminApi.createGoalMacroRule(body);
    showToast(editId ? 'Updated' : 'Created', 'success');
    closeModal(); load();
  } catch(e) { showToast(e.message, 'error'); }
}

async function del(id) {
  if (!confirm('Delete this rule? The basket engine will lose calorie targets for this goal.')) return;
  try { await adminApi.deleteGoalMacroRule(id); showToast('Deleted', 'success'); load(); }
  catch(e) { showToast(e.message, 'error'); }
}
load();
</script></body></html>
