<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Health Conditions · KRISHA PURE Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=DM+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="css/admin.css"/></head><body>
<script src="js/api.js"></script><script>Auth.guardMenu('health-conditions');</script>
<script src="js/sidebar.js"></script>
<script>
const content = renderShell({
  active: 'health-conditions',
  title: 'Health Conditions',
  sub: 'Health conditions shown to customers during setup — drives clinical review triggers and goal suggestions',
  actions: `<button class="btn btn-primary" onclick="openModal()">+ Add Condition</button>`
});

let items = [], editId = null;

content.innerHTML = `
<div class="panel">
  <div class="toolbar">
    <input type="search" id="srch" placeholder="Search conditions…" oninput="render()"/>
    <div class="spacer"></div>
    <span id="cnt" class="muted" style="font-size:12px"></span>
  </div>
  <div class="table-wrap"><table class="data">
    <thead><tr>
      <th>Code</th><th>Condition Name</th><th>Category</th><th>Suggested Goal</th><th>Clinical Review</th><th>Auto Plan</th><th>Status</th><th></th>
    </tr></thead>
    <tbody id="tbody"></tbody>
  </table></div>
</div>

<div class="modal-backdrop" id="modal" style="display:none" onclick="if(event.target===this)closeModal()">
<div class="modal wide"><div class="modal-head"><h3 id="mTitle">Add Health Condition</h3><button class="modal-close" onclick="closeModal()">✕</button></div>
<div style="overflow-y:auto;max-height:68vh"><div class="form-grid">
  <div class="field"><label>Condition Code</label><input id="fConditionCode" placeholder="HC001"/></div>
  <div class="field"><label>Condition Name *</label><input id="fConditionName" placeholder="Diabetes"/></div>
  <div class="field"><label>Display Name</label><input id="fDisplayName" placeholder="Diabetes Mellitus"/></div>
  <div class="field"><label>Category</label><input id="fCategory" placeholder="Metabolic"/></div>
  <div class="field full"><label>Description</label><textarea id="fDescription" rows="2"></textarea></div>
  <div class="field"><label>Suggested Goal Code <span class="opt">e.g. WG005</span></label><input id="fSuggestedGoalCode" placeholder="WG005"/></div>
  <div class="field"><label>Severity Applicable</label><select id="fSeverityApplicable"><option>Yes</option><option>No</option><option>Conditional</option></select></div>
  <div class="field"><label>Clinical Review Required</label><select id="fClinicalReviewRequired"><option>No</option><option>Yes</option><option>Conditional</option></select></div>
  <div class="field"><label>Auto Plan Eligible</label><select id="fAutoPlanEligible"><option>Yes</option><option>No</option><option>Conditional</option></select></div>
  <div class="field"><label>Priority</label><select id="fPriority"><option>Highest</option><option>High</option><option>Medium</option><option>Low</option></select></div>
  <div class="field"><label>Rule Status</label><select id="fRuleStatus"><option>Approved</option><option>Pending</option><option>Inactive</option></select></div>
  <div class="field"><label>Nutritionist Approved</label><select id="fNutritionistApproved"><option value="Yes">Yes</option><option value="No">No</option></select></div>
  <div class="field"><label>Active</label><select id="fIsActive"><option value="true">Yes</option><option value="false">No</option></select></div>
  <div class="field full"><label>Nutritionist Comments</label><textarea id="fNutritionistComments" rows="2"></textarea></div>
</div></div>
<div class="modal-foot"><button class="btn btn-ghost" onclick="closeModal()">Cancel</button><button class="btn btn-primary" onclick="save()">Save</button></div>
</div></div>`;

async function load() {
  document.getElementById('tbody').innerHTML = '<tr><td colspan="8" class="loading-row"><span class="spinner"></span></td></tr>';
  try {
    const d = await adminApi.getHealthConditions();
    items = d.conditions || d.items || [];
    render();
  } catch(e) { showToast(e.message, 'error'); }
}

function render() {
  const q = (document.getElementById('srch').value||'').toLowerCase();
  const f = items.filter(i => !q || JSON.stringify(i).toLowerCase().includes(q));
  document.getElementById('cnt').textContent = `${f.length} conditions`;
  document.getElementById('tbody').innerHTML = f.map(i => `<tr>
    <td class="mono"><b>${escapeHtml(i.conditionCode||'')}</b></td>
    <td>${escapeHtml(i.conditionName||'')}</td>
    <td style="font-size:12px">${escapeHtml(i.category||'')}</td>
    <td class="mono" style="font-size:12px">${escapeHtml(i.suggestedGoalCode||'–')}</td>
    <td><span class="pill ${i.clinicalReviewRequired==='Yes'?'pill-warn':i.clinicalReviewRequired==='Conditional'?'pill-placed':'pill-inactive'}">${escapeHtml(i.clinicalReviewRequired||'No')}</span></td>
    <td><span class="pill ${i.autoPlanEligible==='Yes'?'pill-active':'pill-inactive'}">${escapeHtml(i.autoPlanEligible||'')}</span></td>
    <td><span class="pill ${i.isActive?'pill-active':'pill-inactive'}">${i.isActive?'Active':'Inactive'}</span></td>
    <td>
      <button class="btn btn-ghost btn-sm" onclick='openModal(${JSON.stringify(i)})'>Edit</button>
      <button class="btn btn-danger btn-sm" onclick="del('${i._id}')">Del</button>
    </td>
  </tr>`).join('') || '<tr><td colspan="8" class="empty">No health conditions found.</td></tr>';
}

function openModal(i) {
  editId = i ? i._id : null;
  document.getElementById('mTitle').textContent = i ? 'Edit Health Condition' : 'Add Health Condition';
  document.getElementById('fConditionCode').value         = i?.conditionCode || '';
  document.getElementById('fConditionName').value         = i?.conditionName || '';
  document.getElementById('fDisplayName').value           = i?.displayName || '';
  document.getElementById('fCategory').value              = i?.category || '';
  document.getElementById('fDescription').value           = i?.description || '';
  document.getElementById('fSuggestedGoalCode').value     = i?.suggestedGoalCode || '';
  document.getElementById('fSeverityApplicable').value    = i?.severityApplicable || 'No';
  document.getElementById('fClinicalReviewRequired').value= i?.clinicalReviewRequired || 'No';
  document.getElementById('fAutoPlanEligible').value      = i?.autoPlanEligible || 'Yes';
  document.getElementById('fPriority').value              = i?.priority || 'Low';
  document.getElementById('fRuleStatus').value            = i?.ruleStatus || 'Approved';
  document.getElementById('fNutritionistApproved').value  = i?.nutritionistApproved || 'Yes';
  document.getElementById('fIsActive').value              = i?.isActive === false ? 'false' : 'true';
  document.getElementById('fNutritionistComments').value  = i?.nutritionistComments || '';
  document.getElementById('modal').style.display = 'flex';
}
function closeModal() { document.getElementById('modal').style.display = 'none'; editId = null; }
function g(id) { const v = document.getElementById(id)?.value; return (v===''||v===undefined) ? null : v; }

async function save() {
  const conditionName = g('fConditionName');
  if (!conditionName) { showToast('Condition Name is required', 'error'); return; }
  const body = {
    conditionCode:          g('fConditionCode'),
    conditionName,
    displayName:            g('fDisplayName'),
    category:               g('fCategory'),
    description:            g('fDescription'),
    suggestedGoalCode:      g('fSuggestedGoalCode'),
    severityApplicable:     g('fSeverityApplicable'),
    clinicalReviewRequired: g('fClinicalReviewRequired'),
    autoPlanEligible:       g('fAutoPlanEligible'),
    priority:               g('fPriority'),
    ruleStatus:             g('fRuleStatus'),
    nutritionistApproved:   g('fNutritionistApproved'),
    isActive:               document.getElementById('fIsActive').value === 'true',
    nutritionistComments:   g('fNutritionistComments'),
  };
  try {
    if (editId) await adminApi.updateHealthCondition(editId, body);
    else        await adminApi.createHealthCondition(body);
    showToast(editId ? 'Updated' : 'Created', 'success');
    closeModal(); load();
  } catch(e) { showToast(e.message, 'error'); }
}

async function del(id) {
  if (!confirm('Delete this health condition?')) return;
  try { await adminApi.deleteHealthCondition(id); showToast('Deleted', 'success'); load(); }
  catch(e) { showToast(e.message, 'error'); }
}
load();
</script></body></html>
