<!DOCTYPE html><html lang="en"><head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Health Conditions · KRISHA PURE Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=DM+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="css/admin.css"/>
</head><body>
<script src="js/api.js"></script><script>Auth.guardMenu('health-conditions');</script>
<script src="js/sidebar.js"></script>
<script>
const content=renderShell({active:'health-conditions',title:'Health Conditions',sub:'20 clinical health conditions used for basket and nutrition rule matching',actions:`<button class="btn btn-primary" onclick="openModal()">+ Add</button>`});
let items=[],editId=null;
content.innerHTML=`
<div class="panel">
<div class="toolbar"><input type="search" id="srch" placeholder="Search…" oninput="render()"/><div class="spacer"></div><span id="cnt" class="muted" style="font-size:12px"></span></div>
<div class="table-wrap"><table class="data">
<thead><tr><th>Code</th><th>Condition Name</th><th>Display Name</th><th>Category</th><th>Severity</th><th>Priority</th><th>Auto Plan</th><th>Clinical Review</th><th>Status</th><th></th></tr></thead>
<tbody id="tbody"></tbody></table></div></div>
<div class="modal-backdrop" id="modal" style="display:none" onclick="if(event.target===this)closeModal()">
<div class="modal wide"><div class="modal-head"><h3 id="mTitle">Add Health Condition</h3><button class="modal-close" onclick="closeModal()">✕</button></div>
<div style="overflow-y:auto;max-height:68vh"><div class="form-grid">
  <div class="field"><label>Condition Code</label><input id="fCode" placeholder="HC001"/></div>
  <div class="field"><label>Condition Name *</label><input id="fName" placeholder="Diabetes"/></div>
  <div class="field"><label>Display Name</label><input id="fDisplay" placeholder="Diabetes"/></div>
  <div class="field"><label>Category</label><input id="fCat" placeholder="Metabolic"/></div>
  <div class="field full"><label>Description</label><textarea id="fDesc" rows="2"></textarea></div>
  <div class="field"><label>Severity Applicable</label><select id="fSev"><option>Yes</option><option>No</option><option>Conditional</option></select></div>
  <div class="field"><label>Clinical Review Required</label><select id="fClin"><option>Yes</option><option>No</option><option>Conditional</option></select></div>
  <div class="field"><label>Auto Plan Eligible</label><select id="fAuto"><option>Yes</option><option>No</option><option>Conditional</option></select></div>
  <div class="field"><label>Priority</label><select id="fPri"><option>Highest</option><option>High</option><option>Medium</option><option>Low</option></select></div>
  <div class="field"><label>Rule Status</label><select id="fStatus"><option>Approved</option><option>Pending</option><option>Inactive</option></select></div>
  <div class="field full"><label>Nutritionist Comments</label><textarea id="fComments" rows="2"></textarea></div>
</div></div>
<div class="modal-foot"><button class="btn btn-ghost" onclick="closeModal()">Cancel</button><button class="btn btn-primary" onclick="save()">Save</button></div>
</div></div>`;

async function load(){
  document.getElementById('tbody').innerHTML='<tr><td colspan="10" class="loading-row"><span class="spinner"></span></td></tr>';
  try{const d=await adminApi.getHealthConditions();items=d.conditions||[];render();}
  catch(e){showToast(e.message,'error');}
}
function render(){
  const q=(document.getElementById('srch').value||'').toLowerCase();
  const f=items.filter(i=>!q||JSON.stringify(i).toLowerCase().includes(q));
  document.getElementById('cnt').textContent=`${f.length} conditions`;
  document.getElementById('tbody').innerHTML=f.map(i=>`<tr>
    <td class="mono">${escapeHtml(i.conditionCode||'')}</td>
    <td><b>${escapeHtml(i.conditionName||'')}</b></td>
    <td>${escapeHtml(i.displayName||'')}</td>
    <td>${escapeHtml(i.category||'')}</td>
    <td>${escapeHtml(i.severityApplicable||'')}</td>
    <td>${escapeHtml(i.priority||'')}</td>
    <td>${escapeHtml(i.autoPlanEligible||'')}</td>
    <td>${escapeHtml(i.clinicalReviewRequired||'')}</td>
    <td><span class="pill ${i.isActive?'pill-active':'pill-inactive'}">${escapeHtml(i.ruleStatus||'')}</span></td>
    <td><button class="btn btn-ghost btn-sm" onclick='openModal(${JSON.stringify(i)})'>Edit</button>
        <button class="btn btn-danger btn-sm" onclick="del('${i._id}')">Del</button></td>
  </tr>`).join('')||'<tr><td colspan="10" class="empty">No records</td></tr>';
}
function openModal(i){
  editId=i?i._id:null;
  document.getElementById('mTitle').textContent=i?'Edit Health Condition':'Add Health Condition';
  document.getElementById('fCode').value=i?.conditionCode||'';
  document.getElementById('fName').value=i?.conditionName||'';
  document.getElementById('fDisplay').value=i?.displayName||'';
  document.getElementById('fCat').value=i?.category||'';
  document.getElementById('fDesc').value=i?.description||'';
  document.getElementById('fSev').value=i?.severityApplicable||'Yes';
  document.getElementById('fClin').value=i?.clinicalReviewRequired||'Yes';
  document.getElementById('fAuto').value=i?.autoPlanEligible||'Yes';
  document.getElementById('fPri').value=i?.priority||'High';
  document.getElementById('fStatus').value=i?.ruleStatus||'Approved';
  document.getElementById('fComments').value=i?.nutritionistComments||'';
  document.getElementById('modal').style.display='flex';
}
function closeModal(){document.getElementById('modal').style.display='none';editId=null;}
function g(id){const v=document.getElementById(id)?.value;return(v===''||v===undefined)?null:v;}
async function save(){
  const body={conditionCode:g('fCode'),conditionName:g('fName'),displayName:g('fDisplay'),
    category:g('fCat'),description:g('fDesc'),severityApplicable:g('fSev'),
    clinicalReviewRequired:g('fClin'),autoPlanEligible:g('fAuto'),priority:g('fPri'),
    ruleStatus:g('fStatus'),nutritionistComments:g('fComments')};
  if(!body.conditionName){showToast('Condition name required','error');return;}
  try{if(editId)await adminApi.updateHealthCondition(editId,body);else await adminApi.createHealthCondition(body);
    showToast(editId?'Updated':'Created','success');closeModal();load();}
  catch(e){showToast(e.message,'error');}
}
async function del(id){if(!confirm('Delete?'))return;try{await adminApi.deleteHealthCondition(id);showToast('Deleted','success');load();}catch(e){showToast(e.message,'error');}}
load();
</script></body></html>
