<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Lifestyle Codes · KRISHA PURE Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=DM+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="css/admin.css"/></head><body>
<script src="js/api.js"></script><script>Auth.guardMenu('lifestyle-codes');</script>
<script src="js/sidebar.js"></script>
<script>
const content = renderShell({
  active: 'lifestyle-codes',
  title: 'Lifestyle Codes',
  sub: 'Lifestyle patterns shown to customers during profile setup — used for nutrition personalization',
  actions: `<button class="btn btn-primary" onclick="openModal()">+ Add Lifestyle Code</button>`
});

let items = [], editId = null;

content.innerHTML = `
<div class="panel">
  <div class="toolbar">
    <input type="search" id="srch" placeholder="Search…" oninput="render()"/>
    <div class="spacer"></div>
    <span id="cnt" class="muted" style="font-size:12px"></span>
  </div>
  <div class="table-wrap"><table class="data">
    <thead><tr>
      <th>Code</th><th>Lifestyle Name</th><th>Age Group</th><th>Hydration Rec.</th><th>Rule Status</th><th>Active</th><th></th>
    </tr></thead>
    <tbody id="tbody"></tbody>
  </table></div>
</div>

<div class="modal-backdrop" id="modal" style="display:none" onclick="if(event.target===this)closeModal()">
<div class="modal wide"><div class="modal-head"><h3 id="mTitle">Add Lifestyle Code</h3><button class="modal-close" onclick="closeModal()">✕</button></div>
<div style="overflow-y:auto;max-height:68vh"><div class="form-grid">
  <div class="field"><label>Lifestyle Code</label><input id="fLifestyleCode" placeholder="LS01"/></div>
  <div class="field"><label>Lifestyle Name *</label><input id="fLifestyleName" placeholder="Standard Healthy Lifestyle"/></div>
  <div class="field"><label>Applicable Age Group</label><input id="fApplicableAgeGroup" placeholder="Adults"/></div>
  <div class="field"><label>Hydration Recommendation</label><input id="fHydrationRecommendation" placeholder="30–35 ml/kg/day"/></div>
  <div class="field full"><label>Display Description <span class="opt">(shown to customer)</span></label><textarea id="fDisplayDescription" rows="2" placeholder="I maintain a regular routine…"></textarea></div>
  <div class="field full"><label>Diet Adjustment <span class="opt">(nutritionist guidance)</span></label><textarea id="fDietAdjustment" rows="2" placeholder="Standard balanced diet"></textarea></div>
  <div class="field"><label>Rule Status</label><select id="fRuleStatus"><option>Approved</option><option>Pending</option><option>Inactive</option></select></div>
  <div class="field"><label>Nutritionist Approved</label><select id="fNutritionistApproved"><option value="Yes">Yes</option><option value="No">No</option></select></div>
  <div class="field"><label>Source IDs <span class="opt">e.g. ICMR-NIN 2024; WHO</span></label><input id="fSourceIds" placeholder="ICMR-NIN 2024; WHO"/></div>
  <div class="field"><label>Active</label><select id="fIsActive"><option value="true">Yes</option><option value="false">No</option></select></div>
  <div class="field full"><label>Nutritionist Comments <span class="opt">(internal)</span></label><textarea id="fNutritionistComments" rows="2"></textarea></div>
</div></div>
<div class="modal-foot"><button class="btn btn-ghost" onclick="closeModal()">Cancel</button><button class="btn btn-primary" onclick="save()">Save</button></div>
</div></div>`;

async function load() {
  document.getElementById('tbody').innerHTML = '<tr><td colspan="7" class="loading-row"><span class="spinner"></span></td></tr>';
  try {
    const d = await adminApi.getLifestyleCodes();
    items = d.lifestyleCodes || d.items || [];
    render();
  } catch(e) { showToast(e.message, 'error'); }
}

function render() {
  const q = (document.getElementById('srch').value||'').toLowerCase();
  const f = items.filter(i => !q || JSON.stringify(i).toLowerCase().includes(q));
  document.getElementById('cnt').textContent = `${f.length} codes`;
  document.getElementById('tbody').innerHTML = f.map(i => `<tr>
    <td class="mono" style="font-size:12px">${escapeHtml(i.lifestyleCode||'')}</td>
    <td><b>${escapeHtml(i.lifestyleName||'')}</b></td>
    <td style="font-size:12px">${escapeHtml(i.applicableAgeGroup||'')}</td>
    <td style="font-size:12px">${escapeHtml(i.hydrationRecommendation||'–')}</td>
    <td><span class="pill ${i.ruleStatus==='Approved'?'pill-active':'pill-inactive'}">${escapeHtml(i.ruleStatus||'')}</span></td>
    <td><span class="pill ${i.isActive?'pill-active':'pill-inactive'}">${i.isActive?'Yes':'No'}</span></td>
    <td>
      <button class="btn btn-ghost btn-sm" onclick='openModal(${JSON.stringify(i)})'>Edit</button>
      <button class="btn btn-danger btn-sm" onclick="del('${i._id}')">Del</button>
    </td>
  </tr>`).join('') || '<tr><td colspan="7" class="empty">No lifestyle codes found.</td></tr>';
}

function openModal(i) {
  editId = i ? i._id : null;
  document.getElementById('mTitle').textContent = i ? 'Edit Lifestyle Code' : 'Add Lifestyle Code';
  document.getElementById('fLifestyleCode').value          = i?.lifestyleCode || '';
  document.getElementById('fLifestyleName').value          = i?.lifestyleName || '';
  document.getElementById('fApplicableAgeGroup').value     = i?.applicableAgeGroup || '';
  document.getElementById('fHydrationRecommendation').value= i?.hydrationRecommendation || '';
  document.getElementById('fDisplayDescription').value     = i?.displayDescription || '';
  document.getElementById('fDietAdjustment').value         = i?.dietAdjustment || '';
  document.getElementById('fRuleStatus').value             = i?.ruleStatus || 'Approved';
  document.getElementById('fNutritionistApproved').value   = i?.nutritionistApproved || 'Yes';
  document.getElementById('fSourceIds').value              = i?.sourceIds || '';
  document.getElementById('fIsActive').value               = i?.isActive === false ? 'false' : 'true';
  document.getElementById('fNutritionistComments').value   = i?.nutritionistComments || '';
  document.getElementById('modal').style.display = 'flex';
}
function closeModal() { document.getElementById('modal').style.display = 'none'; editId = null; }
function g(id) { const v = document.getElementById(id)?.value; return (v===''||v===undefined) ? null : v; }

async function save() {
  const lifestyleName = g('fLifestyleName');
  if (!lifestyleName) { showToast('Lifestyle Name is required', 'error'); return; }
  const body = {
    lifestyleCode:           g('fLifestyleCode'),
    lifestyleName,
    applicableAgeGroup:      g('fApplicableAgeGroup'),
    hydrationRecommendation: g('fHydrationRecommendation'),
    displayDescription:      g('fDisplayDescription'),
    dietAdjustment:          g('fDietAdjustment'),
    ruleStatus:              g('fRuleStatus'),
    nutritionistApproved:    g('fNutritionistApproved'),
    sourceIds:               g('fSourceIds'),
    isActive:                document.getElementById('fIsActive').value === 'true',
    nutritionistComments:    g('fNutritionistComments'),
  };
  try {
    if (editId) await adminApi.updateLifestyleCode(editId, body);
    else        await adminApi.createLifestyleCode(body);
    showToast(editId ? 'Updated' : 'Created', 'success');
    closeModal(); load();
  } catch(e) { showToast(e.message, 'error'); }
}

async function del(id) {
  if (!confirm('Delete this lifestyle code?')) return;
  try { await adminApi.deleteLifestyleCode(id); showToast('Deleted', 'success'); load(); }
  catch(e) { showToast(e.message, 'error'); }
}
load();
</script></body></html>
