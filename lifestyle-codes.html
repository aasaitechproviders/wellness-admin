<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Lifestyle Codes · KRISHA PURE Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=DM+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="css/admin.css"/></head><body>
<script src="js/api.js"></script><script>Auth.guardMenu('lifestyle-codes');</script><script src="js/sidebar.js"></script>
<script>
const content=renderShell({active:'lifestyle-codes',title:'Lifestyle Codes',sub:'12 lifestyle profiles with diet and hydration adjustment rules',actions:`<button class="btn btn-primary" onclick="openModal()">+ Add</button>`});
let items=[],editId=null;
content.innerHTML=`<div class="panel">
<div class="toolbar"><input type="search" id="srch" placeholder="Search…" oninput="render()"/><div class="spacer"></div><span id="cnt" class="muted" style="font-size:12px"></span></div>
<div class="table-wrap"><table class="data"><thead><tr><th>Code</th><th>Lifestyle Name</th><th>Age Group</th><th>Diet Adjustment</th><th>Hydration</th><th>Status</th><th></th></tr></thead><tbody id="tbody"></tbody></table></div></div>
<div class="modal-backdrop" id="modal" style="display:none" onclick="if(event.target===this)closeModal()">
<div class="modal wide"><div class="modal-head"><h3 id="mTitle">Add Lifestyle Code</h3><button class="modal-close" onclick="closeModal()">✕</button></div>
<div style="overflow-y:auto;max-height:68vh"><div class="form-grid">
  <div class="field"><label>Lifestyle Code</label><input id="fCode" placeholder="LS01"/></div>
  <div class="field"><label>Lifestyle Name *</label><input id="fName" placeholder="Standard Healthy Lifestyle"/></div>
  <div class="field"><label>Applicable Age Group</label><input id="fAge" placeholder="Adults"/></div>
  <div class="field"><label>Hydration Recommendation</label><input id="fHyd" placeholder="30–35 ml/kg/day"/></div>
  <div class="field full"><label>Customer Selection Description</label><textarea id="fDesc" rows="2" placeholder="I maintain a regular routine…"></textarea></div>
  <div class="field full"><label>Diet Adjustment</label><textarea id="fDiet" rows="2" placeholder="Standard balanced diet"></textarea></div>
  <div class="field"><label>Rule Status</label><select id="fStatus"><option>Approved</option><option>Pending</option><option>Inactive</option></select></div>
  <div class="field"><label>Nutritionist Approved</label><select id="fApproved"><option>Yes</option><option>No</option></select></div>
  <div class="field"><label>Source IDs</label><input id="fSource" placeholder="ICMR-NIN 2024; WHO"/></div>
  <div class="field full"><label>Nutritionist Comments</label><textarea id="fComments" rows="2"></textarea></div>
</div></div>
<div class="modal-foot"><button class="btn btn-ghost" onclick="closeModal()">Cancel</button><button class="btn btn-primary" onclick="save()">Save</button></div>
</div></div>`;

async function load(){
  document.getElementById('tbody').innerHTML='<tr><td colspan="7" class="loading-row"><span class="spinner"></span></td></tr>';
  try{const d=await adminApi.getLifestyleCodes();items=d.lifestyleCodes||[];render();}catch(e){showToast(e.message,'error');}
}
function render(){
  const q=(document.getElementById('srch').value||'').toLowerCase();
  const f=items.filter(i=>!q||JSON.stringify(i).toLowerCase().includes(q));
  document.getElementById('cnt').textContent=`${f.length} records`;
  document.getElementById('tbody').innerHTML=f.map(i=>`<tr>
    <td class="mono">${escapeHtml(i.lifestyleCode||'')}</td><td><b>${escapeHtml(i.lifestyleName||'')}</b></td>
    <td>${escapeHtml(i.applicableAgeGroup||'')}</td><td>${escapeHtml((i.dietAdjustment||'').substring(0,50))}${(i.dietAdjustment||'').length>50?'…':''}</td>
    <td>${escapeHtml(i.hydrationRecommendation||'')}</td>
    <td><span class="pill ${i.isActive?'pill-active':'pill-inactive'}">${escapeHtml(i.ruleStatus||'')}</span></td>
    <td><button class="btn btn-ghost btn-sm" onclick='openModal(${JSON.stringify(i)})'>Edit</button>
        <button class="btn btn-danger btn-sm" onclick="del('${i._id}')">Del</button></td>
  </tr>`).join('')||'<tr><td colspan="7" class="empty">No records</td></tr>';
}
function openModal(i){
  editId=i?i._id:null;document.getElementById('mTitle').textContent=i?'Edit Lifestyle Code':'Add Lifestyle Code';
  document.getElementById('fCode').value=i?.lifestyleCode||'';document.getElementById('fName').value=i?.lifestyleName||'';
  document.getElementById('fAge').value=i?.applicableAgeGroup||'';document.getElementById('fHyd').value=i?.hydrationRecommendation||'';
  document.getElementById('fDesc').value=i?.displayDescription||'';document.getElementById('fDiet').value=i?.dietAdjustment||'';
  document.getElementById('fStatus').value=i?.ruleStatus||'Approved';document.getElementById('fApproved').value=i?.nutritionistApproved||'Yes';
  document.getElementById('fSource').value=i?.sourceIds||'';document.getElementById('fComments').value=i?.nutritionistComments||'';
  document.getElementById('modal').style.display='flex';
}
function closeModal(){document.getElementById('modal').style.display='none';editId=null;}
function g(id){const v=document.getElementById(id)?.value;return(v===''||v===undefined)?null:v;}
async function save(){
  const body={lifestyleCode:g('fCode'),lifestyleName:g('fName'),applicableAgeGroup:g('fAge'),
    hydrationRecommendation:g('fHyd'),displayDescription:g('fDesc'),dietAdjustment:g('fDiet'),
    ruleStatus:g('fStatus'),nutritionistApproved:g('fApproved'),sourceIds:g('fSource'),nutritionistComments:g('fComments')};
  if(!body.lifestyleName){showToast('Name required','error');return;}
  try{if(editId)await adminApi.updateLifestyleCode(editId,body);else await adminApi.createLifestyleCode(body);
    showToast(editId?'Updated':'Created','success');closeModal();load();}catch(e){showToast(e.message,'error');}
}
async function del(id){if(!confirm('Delete?'))return;try{await adminApi.deleteLifestyleCode(id);showToast('Deleted','success');load();}catch(e){showToast(e.message,'error');}}
load();
</script></body></html>
