<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>MET Ranges · KRISHA PURE Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=DM+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="css/admin.css"/></head><body>
<script src="js/api.js"></script><script>Auth.guardMenu('met-ranges');</script>
<script src="js/sidebar.js"></script>
<script>
const content = renderShell({
  active: 'met-ranges',
  title: 'MET Ranges',
  sub: 'User self-reported exertion levels shown as dropdown during customer profile setup',
  actions: `<button class="btn btn-primary" onclick="openModal()">+ Add MET Range</button>`
});

let items = [], editId = null;

content.innerHTML = `
<div class="panel">
  <div class="toolbar">
    <input type="search" id="srch" placeholder="Search…" oninput="render()"/>
    <div class="spacer"></div>
    <span id="cnt" class="muted" style="font-size:12px"></span>
  </div>
  <div class="table-wrap"><table class="data">
    <thead><tr>
      <th>Sort</th><th>Name</th><th>MET Value</th><th>Description</th><th>Active</th><th></th>
    </tr></thead>
    <tbody id="tbody"></tbody>
  </table></div>
</div>

<div class="modal-backdrop" id="modal" style="display:none" onclick="if(event.target===this)closeModal()">
<div class="modal"><div class="modal-head"><h3 id="mTitle">Add MET Range</h3><button class="modal-close" onclick="closeModal()">✕</button></div>
<div class="form-grid" style="padding:4px 0 12px">
  <div class="field"><label>Name * <span class="opt">shown to customer</span></label><input id="fName" placeholder="3–6 MET (Moderate)"/></div>
  <div class="field"><label>MET Value <span class="opt">numeric or null for "Don't Know"</span></label><input id="fMetValue" type="number" step="0.1" placeholder="4.5"/></div>
  <div class="field"><label>Sort Order</label><input id="fSortOrder" type="number" placeholder="1"/></div>
  <div class="field"><label>Active</label><select id="fIsActive"><option value="true">Yes</option><option value="false">No</option></select></div>
  <div class="field full"><label>Description <span class="opt">(shown to customer)</span></label><textarea id="fDescription" rows="2" placeholder="Moderate activities like brisk walking, cycling, light exercise"></textarea></div>
</div>
<div class="modal-foot"><button class="btn btn-ghost" onclick="closeModal()">Cancel</button><button class="btn btn-primary" onclick="save()">Save</button></div>
</div></div>`;

async function load() {
  document.getElementById('tbody').innerHTML = '<tr><td colspan="6" class="loading-row"><span class="spinner"></span></td></tr>';
  try {
    const d = await adminApi.getMetRanges();
    items = (d.metRanges || d.items || []).sort((a,b)=>(a.sortOrder||99)-(b.sortOrder||99));
    render();
  } catch(e) { showToast(e.message, 'error'); }
}

function render() {
  const q = (document.getElementById('srch').value||'').toLowerCase();
  const f = items.filter(i => !q || JSON.stringify(i).toLowerCase().includes(q));
  document.getElementById('cnt').textContent = `${f.length} ranges`;
  document.getElementById('tbody').innerHTML = f.map(i => `<tr>
    <td class="mono">${i.sortOrder??'–'}</td>
    <td><b>${escapeHtml(i.name||'')}</b></td>
    <td class="mono">${i.metValue ?? '–'}</td>
    <td style="font-size:12px;color:var(--ink-soft);max-width:240px">${escapeHtml(i.description||'')}</td>
    <td><span class="pill ${i.isActive?'pill-active':'pill-inactive'}">${i.isActive?'Yes':'No'}</span></td>
    <td>
      <button class="btn btn-ghost btn-sm" onclick='openModal(${JSON.stringify(i)})'>Edit</button>
      <button class="btn btn-danger btn-sm" onclick="del('${i._id}')">Del</button>
    </td>
  </tr>`).join('') || '<tr><td colspan="6" class="empty">No MET ranges found.</td></tr>';
}

function openModal(i) {
  editId = i ? i._id : null;
  document.getElementById('mTitle').textContent = i ? 'Edit MET Range' : 'Add MET Range';
  document.getElementById('fName').value        = i?.name || '';
  document.getElementById('fMetValue').value    = i?.metValue ?? '';
  document.getElementById('fSortOrder').value   = i?.sortOrder ?? '';
  document.getElementById('fIsActive').value    = i?.isActive === false ? 'false' : 'true';
  document.getElementById('fDescription').value = i?.description || '';
  document.getElementById('modal').style.display = 'flex';
}
function closeModal() { document.getElementById('modal').style.display = 'none'; editId = null; }
function g(id) { const v = document.getElementById(id)?.value; return (v===''||v===undefined) ? null : v; }

async function save() {
  const name = g('fName');
  if (!name) { showToast('Name is required', 'error'); return; }
  const metVal = document.getElementById('fMetValue').value;
  const body = {
    name,
    metValue:    metVal !== '' ? parseFloat(metVal) : null,
    sortOrder:   parseInt(document.getElementById('fSortOrder').value) || 99,
    isActive:    document.getElementById('fIsActive').value === 'true',
    description: g('fDescription'),
  };
  try {
    if (editId) await adminApi.updateMetRange(editId, body);
    else        await adminApi.createMetRange(body);
    showToast(editId ? 'Updated' : 'Created', 'success');
    closeModal(); load();
  } catch(e) { showToast(e.message, 'error'); }
}

async function del(id) {
  if (!confirm('Delete this MET range?')) return;
  try { await adminApi.deleteMetRange(id); showToast('Deleted', 'success'); load(); }
  catch(e) { showToast(e.message, 'error'); }
}
load();
</script></body></html>
