<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Orders · KRISHA PURE Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=DM+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="css/admin.css" />
</head>
<body>
<script src="js/api.js"></script>
<script>Auth.guard();</script>
<script src="js/sidebar.js"></script>
<script>
const content = renderShell({ active: 'orders', title: 'Orders', sub: 'Track and manage all subscription deliveries' });

// All statuses including subscription flow
const ORDER_STATUSES = ['scheduled','packed','out_for_delivery','delivered','cancelled'];
const STATUS_LABEL   = {
  scheduled:        'Scheduled',
  packed:           'Packed',
  out_for_delivery: 'Out for Delivery',
  delivered:        'Delivered',
  cancelled:        'Cancelled',
};
const STATUS_COLOR = {
  scheduled:        '#1B5E3B',
  packed:           '#C9A84C',
  out_for_delivery: '#1565C0',
  delivered:        '#2E7D32',
  cancelled:        '#C62828',
};

let state = { status: 'scheduled', date: '', search: '', page: 1, limit: 20 };

content.innerHTML = `
  <div class="toolbar">
    <input type="text" id="f-search" placeholder="Search member name…" style="min-width:200px" />
    <select id="f-status">
      <option value="">All statuses</option>
      ${ORDER_STATUSES.map(s => `<option value="${s}" ${s === 'scheduled' ? 'selected' : ''}>${STATUS_LABEL[s]}</option>`).join('')}
    </select>
    <input type="date" id="f-date" />
    <div class="spacer"></div>
    <button class="btn btn-ghost btn-sm" id="f-clear">Clear filters</button>
  </div>

  <div class="panel">
    <div class="table-wrap">
      <table class="data">
        <thead><tr>
          <th>Member</th>
          <th>Family / Phone</th>
          <th>Plan</th>
          <th>Delivery Date</th>
          <th>Items</th>
          <th>Product Cost</th>
          <th>Packaging</th>
          <th>Delivery</th>
          <th>Profit</th>
          <th style="color:var(--green-dark)">Total</th>
          <th>Status</th>
          <th></th>
        </tr></thead>
        <tbody id="orders-body">
          <tr><td colspan="12" class="loading-row"><div class="spinner"></div></td></tr>
        </tbody>
      </table>
    </div>
    <div class="pagination" id="pagination"></div>
  </div>

  <div id="modal-root"></div>
`;

// Wire filters
['f-search','f-status','f-date'].forEach(id => {
  const el = document.getElementById(id);
  const ev = id === 'f-search' ? 'input' : 'change';
  let t;
  el.addEventListener(ev, () => {
    clearTimeout(t);
    t = setTimeout(() => {
      state.search = document.getElementById('f-search').value.trim();
      state.status = document.getElementById('f-status').value;
      state.date   = document.getElementById('f-date').value;
      state.page   = 1;
      loadOrders();
    }, id === 'f-search' ? 350 : 0);
  });
});

document.getElementById('f-clear').addEventListener('click', () => {
  state = { status: 'scheduled', date: '', search: '', page: 1, limit: 20 };
  document.getElementById('f-search').value = '';
  document.getElementById('f-status').value = 'scheduled';
  document.getElementById('f-date').value   = '';
  loadOrders();
});

function statusPill(s) {
  const color = STATUS_COLOR[s] || '#666';
  return `<span style="display:inline-block;padding:2px 9px;border-radius:5px;font-size:11px;font-weight:700;background:${color}18;color:${color}">${STATUS_LABEL[s] || s}</span>`;
}

function statusSelect(order) {
  return `<select class="status-select" data-id="${order._id}"
    style="padding:5px 8px;border-radius:7px;border:1.5px solid var(--border);font-size:12px;background:#fff">
    ${ORDER_STATUSES.map(s => `<option value="${s}" ${s === order.status ? 'selected' : ''}>${STATUS_LABEL[s]}</option>`).join('')}
  </select>`;
}

function fmtCost(v) {
  if (v == null) return '<span class="muted">–</span>';
  return `<span class="mono">₹${(+v).toFixed(0)}</span>`;
}

async function loadOrders() {
  document.getElementById('orders-body').innerHTML =
    `<tr><td colspan="12" class="loading-row"><div class="spinner"></div></td></tr>`;
  try {
    const { orders, total, pages } = await adminApi.getOrders({
      status: state.status, date: state.date, search: state.search,
      page: state.page, limit: state.limit,
    });

    if (!orders.length) {
      document.getElementById('orders-body').innerHTML =
        `<tr><td colspan="12"><div class="empty"><div class="icon">📦</div>No orders match these filters</div></td></tr>`;
    } else {
      document.getElementById('orders-body').innerHTML = orders.map(o => {
        const items = o.basketItems || o.items || [];
        const delivDate = o.deliveryDate ? fmtDate(o.deliveryDate, { day:'numeric', month:'short' }) : '–';
        const slot      = o.deliverySlot ? `<div class="muted" style="font-size:11px">${escapeHtml(o.deliverySlot)}</div>` : '';
        return `<tr>
          <td>
            <div style="font-weight:600">${escapeHtml(o.memberName || '–')}</div>
            <div class="muted" style="font-size:11px">${escapeHtml(o.wellnessGoal || '')}</div>
          </td>
          <td>
            ${escapeHtml(o.familyName || '–')}
            <div class="muted mono" style="font-size:11px">${escapeHtml(o.phone || '')}</div>
          </td>
          <td>
            <div style="font-size:12px;font-weight:600">${escapeHtml(o.planDisplayName || o.planType || '–')}</div>
            <div class="muted" style="font-size:11px">Every ${o.deliveryFreqDays || '?'} days</div>
          </td>
          <td>${delivDate}${slot}</td>
          <td class="mono">${items.length}</td>
          <td>${fmtCost(o.productCost)}</td>
          <td>${fmtCost(o.packagingCost)}</td>
          <td>${fmtCost(o.deliveryCost)}</td>
          <td>${fmtCost(o.profitAmount)}</td>
          <td><span class="mono" style="font-weight:700;color:var(--green-dark)">₹${(o.totalAmount||0).toFixed(0)}</span></td>
          <td>${statusSelect(o)}</td>
          <td>
            <button class="btn btn-ghost btn-sm" onclick="openOrder('${o._id}')">View</button>
          </td>
        </tr>`;
      }).join('');
    }

    document.getElementById('pagination').innerHTML = `
      <span>${total} order${total === 1 ? '' : 's'} · Page ${state.page} of ${pages || 1}</span>
      <button ${state.page <= 1 ? 'disabled' : ''} onclick="changePage(-1)">‹</button>
      <button ${state.page >= pages ? 'disabled' : ''} onclick="changePage(1)">›</button>
    `;

    document.querySelectorAll('.status-select').forEach(sel => {
      sel.addEventListener('change', async () => {
        try {
          await adminApi.updateStatus(sel.dataset.id, sel.value);
          showToast('Status updated', 'success');
        } catch (e) { showToast(e.message, 'error'); }
      });
    });
  } catch (e) {
    document.getElementById('orders-body').innerHTML =
      `<tr><td colspan="12"><div class="empty"><div class="icon">⚠️</div>${escapeHtml(e.message)}</div></td></tr>`;
  }
}

function changePage(d) { state.page += d; loadOrders(); }

async function openOrder(id) {
  const root = document.getElementById('modal-root');
  root.innerHTML = `<div class="modal-backdrop" onclick="if(event.target===this)this.remove()">
    <div class="modal wide"><div class="loading-row"><div class="spinner"></div></div></div></div>`;
  try {
    const { order: o } = await adminApi.getOrder(id);
    const items = o.basketItems || o.items || [];

    // Cost breakdown
    const productCost   = o.productCost   ?? items.reduce((s,i) => s+(i.estimatedCost||0), 0);
    const packagingCost = o.packagingCost ?? null;
    const deliveryCost  = o.deliveryCost  ?? null;
    const profitAmount  = o.profitAmount  ?? null;
    const totalAmount   = o.totalAmount   || 0;

    const costRow = (label, val, bold, color) => val != null
      ? `<div style="display:flex;justify-content:space-between;padding:5px 0;${bold?'font-weight:700':''}${color?';color:'+color:''}">
           <span>${label}</span><span class="mono">₹${(+val).toFixed(2)}</span></div>`
      : '';

    root.querySelector('.modal').innerHTML = `
      <div class="modal-head">
        <h3>${escapeHtml(o.memberName || 'Order')}</h3>
        <button class="modal-close" onclick="document.getElementById('modal-root').innerHTML=''">✕</button>
      </div>

      <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:14px">
        ${statusPill(o.status)}
        <span style="background:var(--green-pale);color:var(--green-dark);padding:2px 9px;border-radius:5px;font-size:11px;font-weight:600">
          ${escapeHtml(o.planDisplayName || o.planType || '')}
        </span>
        <span class="muted" style="font-size:12px">Every ${o.deliveryFreqDays||'?'} days · ${o.durationMonths||'?'} month plan</span>
      </div>

      <div class="grid-2" style="gap:20px;margin-bottom:16px">
        <div>
          <div class="panel-title" style="font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--ink-faint);margin-bottom:6px">Member</div>
          <div style="font-size:13.5px;line-height:1.8">
            <b>${escapeHtml(o.memberName || '–')}</b><br/>
            ${escapeHtml(o.wellnessGoal || '–')}<br/>
            <span class="muted" style="font-size:12px">Family: ${escapeHtml(o.familyName || '–')}</span><br/>
            <span class="muted" style="font-size:12px">${escapeHtml(o.phone || '')}</span>
          </div>
        </div>
        <div>
          <div class="panel-title" style="font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--ink-faint);margin-bottom:6px">Delivery</div>
          <div style="font-size:13.5px;line-height:1.8">
            <b>${fmtDate(o.deliveryDate, { weekday:'short', day:'numeric', month:'short', year:'numeric' })}</b><br/>
            ${escapeHtml(o.deliverySlot || '–')}<br/>
            <span class="muted" style="font-size:12px">Payment: ${escapeHtml(o.paymentMethod || '–')}</span>
          </div>
        </div>
      </div>

      <div class="divider"></div>
      <div class="panel-title" style="font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--ink-faint);margin-bottom:8px">
        Basket Items (${items.length})
      </div>
      <div class="table-wrap" style="margin-bottom:16px">
        <table class="data">
          <thead><tr>
            <th>Product</th><th>Category</th><th>Qty</th><th>Price/100g</th><th>Cost</th>
          </tr></thead>
          <tbody>
            ${items.length
              ? items.map(it => `<tr>
                  <td style="font-weight:600">${escapeHtml(it.name || '–')}</td>
                  <td><span style="padding:1px 7px;border-radius:4px;background:var(--green-pale);color:var(--green-dark);font-size:11px">${escapeHtml(it.category||'–')}</span></td>
                  <td class="mono">${it.quantityG||0} g</td>
                  <td class="mono">₹${(it.pricePer100g||0).toFixed(0)}/100g</td>
                  <td class="mono" style="font-weight:600">₹${(it.estimatedCost||0).toFixed(2)}</td>
                </tr>`).join('')
              : '<tr><td colspan="5" class="muted" style="text-align:center;padding:16px">No items</td></tr>'}
          </tbody>
        </table>
      </div>

      <div class="divider"></div>
      <div class="panel-title" style="font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--ink-faint);margin-bottom:8px">Cost Breakdown</div>
      <div style="background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:12px 16px;margin-bottom:16px">
        ${costRow('Product Cost (raw materials)', productCost)}
        ${costRow('Packaging Cost', packagingCost)}
        ${costRow('Delivery / Logistics Cost', deliveryCost)}
        ${costRow('Profit Margin', profitAmount)}
        <div style="border-top:1.5px solid var(--border);margin:8px 0"></div>
        ${costRow('Total Order Value', totalAmount, true, 'var(--green-dark)')}
      </div>

      <div class="modal-foot">
        <label class="muted" style="font-size:12px;align-self:center;margin-right:6px">Update status:</label>
        <select id="modal-status" style="padding:7px 10px;border-radius:8px;border:1.5px solid var(--border)">
          ${ORDER_STATUSES.map(s => `<option value="${s}" ${s === o.status ? 'selected' : ''}>${STATUS_LABEL[s]}</option>`).join('')}
        </select>
        <button class="btn btn-primary" id="modal-save">Save</button>
        <button class="btn btn-ghost" style="color:var(--red)" id="modal-cancel-btn">Cancel Order</button>
      </div>
    `;

    root.querySelector('#modal-save').addEventListener('click', async () => {
      try {
        await adminApi.updateStatus(id, root.querySelector('#modal-status').value);
        showToast('Status updated', 'success');
        root.innerHTML = '';
        loadOrders();
      } catch (e) { showToast(e.message, 'error'); }
    });

    root.querySelector('#modal-cancel-btn').addEventListener('click', async () => {
      if (!confirm('Cancel this order? This cannot be undone.')) return;
      try {
        await adminApi.updateStatus(id, 'cancelled');
        showToast('Order cancelled', 'success');
        root.innerHTML = '';
        loadOrders();
      } catch (e) { showToast(e.message, 'error'); }
    });

  } catch (e) {
    root.querySelector('.modal').innerHTML =
      `<div class="empty"><div class="icon">⚠️</div>${escapeHtml(e.message)}</div>`;
  }
}

loadOrders();
</script>
</body>
</html>
