<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Plan Types · KRISHA PURE Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=DM+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="css/admin.css"/></head><body>
<script src="js/api.js"></script><script>Auth.guardMenu('plan-types');</script>
<script src="js/sidebar.js"></script>
<script>
const content = renderShell({
  active: 'plan-types',
  title: 'Plan Types (T20 / T30 / T40)',
  sub: 'LIV Care / LIV Balance / LIV Premium plan definitions — controls basket category coverage and customisation',
  actions: `<button class="btn btn-primary" onclick="openModal()">+ Add Plan Type</button>`
});

const ALL_CATEGORIES = ['Vegetable','Leafy Vegetables','Fruits','Microgreens','Nuts and Seeds','Milk Products','Sprouts','Herbs'];
let items = [], editId = null;

content.innerHTML = `
<div class="panel">
  <div class="toolbar">
    <input type="search" id="srch" placeholder="Search…" oninput="render()"/>
    <div class="spacer"></div>
    <span id="cnt" class="muted" style="font-size:12px"></span>
  </div>
  <div class="table-wrap"><table class="data">
    <thead><tr>
      <th>Code</th><th>Plan Name</th><th>Coverage %</th><th>Duration Days</th><th>Included Categories</th><th>Customisation</th><th>Active</th><th></th>
    </tr></thead>
    <tbody id="tbody"></tbody>
  </table></div>
</div>

<div class="modal-backdrop" id="modal" style="display:none" onclick="if(event.target===this)closeModal()">
<div class="modal wide"><div class="modal-head"><h3 id="mTitle">Add Plan Type</h3><button class="modal-close" onclick="closeModal()">✕</button></div>
<div style="overflow-y:auto;max-height:68vh"><div class="form-grid">
  <div class="field"><label>Plan Code * <span class="opt">T20 / T30 / T40</span></label><input id="fPlanCode" placeholder="T20" style="text-transform:uppercase"/></div>
  <div class="field"><label>Plan Name *</label><input id="fPlanName" placeholder="LIV Care"/></div>
  <div class="field"><label>Coverage % <span class="opt">% of weekly nutrition covered</span></label><input id="fCoveragePct" type="number" min="1" max="100" placeholder="30"/></div>
  <div class="field"><label>Duration Days</label><input id="fDurationDays" type="number" placeholder="7"/></div>
  <div class="field"><label>Allow Customisation</label><select id="fAllowCustomisation"><option value="false">No</option><option value="true">Yes</option></select></div>
  <div class="field"><label>Status</label><select id="fStatus"><option>Active</option><option>Inactive</option></select></div>
  <div class="field"><label>Active</label><select id="fIsActive"><option value="true">Yes</option><option value="false">No</option></select></div>
  <div class="field full"><label>Description</label><textarea id="fDescription" rows="2" placeholder="Brief description shown to customer…"></textarea></div>
  <div class="field full"><label>Notes <span class="opt">(internal)</span></label><textarea id="fNotes" rows="2"></textarea></div>

  <div class="field full" style="border-top:1px solid var(--border);padding-top:12px;margin-top:4px">
    <label style="font-weight:700;font-size:13px">Included Categories <span class="opt">(select all that apply)</span></label>
    <div id="catCheckboxes" style="display:flex;flex-wrap:wrap;gap:8px;margin-top:8px">
      ${ALL_CATEGORIES.map(c => `
        <label style="display:flex;align-items:center;gap:5px;font-size:13px;cursor:pointer;background:var(--bg-soft);padding:4px 10px;border-radius:6px;border:1px solid var(--border)">
          <input type="checkbox" class="cat-cb" value="${c}" style="width:auto"/> ${c}
        </label>
      `).join('')}
    </div>
  </div>
</div></div>
<div class="modal-foot"><button class="btn btn-ghost" onclick="closeModal()">Cancel</button><button class="btn btn-primary" onclick="save()">Save</button></div>
</div></div>`;

async function load() {
  document.getElementById('tbody').innerHTML = '<tr><td colspan="8" class="loading-row"><span class="spinner"></span></td></tr>';
  try {
    const d = await adminApi.getPlanTypes();
    items = (d.planTypes || d.items || []).sort((a,b) => (a.planCode||'').localeCompare(b.planCode||''));
    render();
  } catch(e) { showToast(e.message, 'error'); }
}

function render() {
  const q = (document.getElementById('srch').value||'').toLowerCase();
  const f = items.filter(i => !q || JSON.stringify(i).toLowerCase().includes(q));
  document.getElementById('cnt').textContent = `${f.length} plan types`;
  document.getElementById('tbody').innerHTML = f.map(i => `<tr>
    <td class="mono"><b>${escapeHtml(i.planCode||'')}</b></td>
    <td>${escapeHtml(i.planName||'')}</td>
    <td class="mono">${i.coveragePct != null ? i.coveragePct+'%' : '–'}</td>
    <td class="mono">${i.durationDays ?? '–'}</td>
    <td style="font-size:11px">${(i.includedCategories||[]).map(c=>`<span style="background:#e8f5e9;color:#2e7d32;padding:1px 6px;border-radius:4px;margin:1px;display:inline-block">${escapeHtml(c)}</span>`).join('')||'–'}</td>
    <td><span class="pill ${i.allowCustomisation?'pill-active':'pill-inactive'}">${i.allowCustomisation?'Yes':'No'}</span></td>
    <td><span class="pill ${i.isActive?'pill-active':'pill-inactive'}">${i.isActive?'Yes':'No'}</span></td>
    <td>
      <button class="btn btn-ghost btn-sm" onclick='openModal(${JSON.stringify(i)})'>Edit</button>
      <button class="btn btn-danger btn-sm" onclick="del('${i._id}')">Del</button>
    </td>
  </tr>`).join('') || '<tr><td colspan="8" class="empty">No plan types found.</td></tr>';
}

function openModal(i) {
  editId = i ? i._id : null;
  document.getElementById('mTitle').textContent = i ? 'Edit Plan Type' : 'Add Plan Type';
  document.getElementById('fPlanCode').value          = i?.planCode || '';
  document.getElementById('fPlanName').value          = i?.planName || '';
  document.getElementById('fCoveragePct').value       = i?.coveragePct ?? '';
  document.getElementById('fDurationDays').value      = i?.durationDays ?? '';
  document.getElementById('fAllowCustomisation').value= i?.allowCustomisation ? 'true' : 'false';
  document.getElementById('fStatus').value            = i?.status || 'Active';
  document.getElementById('fIsActive').value          = i?.isActive === false ? 'false' : 'true';
  document.getElementById('fDescription').value       = i?.description || '';
  document.getElementById('fNotes').value             = i?.notes || '';
  const selected = i?.includedCategories || [];
  document.querySelectorAll('.cat-cb').forEach(cb => { cb.checked = selected.includes(cb.value); });
  document.getElementById('modal').style.display = 'flex';
}
function closeModal() { document.getElementById('modal').style.display = 'none'; editId = null; }
function g(id) { const v = document.getElementById(id)?.value; return (v===''||v===undefined) ? null : v; }
function gn(id) { const v = parseFloat(document.getElementById(id)?.value); return isNaN(v) ? null : v; }
function gi(id) { const v = parseInt(document.getElementById(id)?.value); return isNaN(v) ? null : v; }

async function save() {
  const planCode = (g('fPlanCode')||'').toUpperCase();
  const planName = g('fPlanName');
  if (!planCode) { showToast('Plan Code is required', 'error'); return; }
  if (!planName) { showToast('Plan Name is required', 'error'); return; }
  const includedCategories = [...document.querySelectorAll('.cat-cb:checked')].map(cb => cb.value);
  const body = {
    planCode,
    planName,
    coveragePct:        gn('fCoveragePct'),
    durationDays:       gi('fDurationDays'),
    allowCustomisation: document.getElementById('fAllowCustomisation').value === 'true',
    status:             g('fStatus'),
    isActive:           document.getElementById('fIsActive').value === 'true',
    description:        g('fDescription'),
    notes:              g('fNotes'),
    includedCategories,
  };
  try {
    if (editId) await adminApi.updatePlanType(editId, body);
    else        await adminApi.createPlanType(body);
    showToast(editId ? 'Updated' : 'Created', 'success');
    closeModal(); load();
  } catch(e) { showToast(e.message, 'error'); }
}

async function del(id) {
  if (!confirm('Delete this plan type? Customers on this plan will be affected.')) return;
  try { await adminApi.deletePlanType(id); showToast('Deleted', 'success'); load(); }
  catch(e) { showToast(e.message, 'error'); }
}
load();
</script></body></html>
