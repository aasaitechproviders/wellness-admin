<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Procurement · KRISHA PURE Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=DM+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="css/admin.css" />
</head>
<body>
<script src="js/api.js"></script>
<script>Auth.guardMenu('procurement');</script>
<script src="js/sidebar.js"></script>
<script>
const content = renderShell({
  active: 'procurement',
  title: 'Procurement',
  sub: 'Daily order quantities and per-member packing breakdown',
});

let selectedDate = (() => {
  const d = new Date(); d.setDate(d.getDate() + 1);
  return d.toISOString().split('T')[0];
})();

content.innerHTML = `
<!-- Date bar -->
<div style="display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:18px">
  <label style="font-size:13px;font-weight:600;color:var(--ink-soft)">Delivery Date</label>
  <input type="date" id="dateInput" value="${selectedDate}"
    style="padding:8px 12px;border:1px solid var(--border);border-radius:8px;font-size:13px;font-family:var(--font-body)"
    onchange="selectedDate=this.value;load()" />
  <button class="btn btn-ghost" onclick="load()" style="font-size:13px">↻ Refresh</button>
</div>

<!-- Day totals stats bar -->
<div id="statsBar" style="display:none;margin-bottom:16px"></div>

<!-- Tabs -->
<div style="display:flex;gap:0;border-bottom:2px solid var(--border);margin-bottom:16px">
  <button id="tabProcure" onclick="switchTab('procure')"
    style="padding:10px 20px;font-size:13px;font-weight:600;border:none;background:none;cursor:pointer;border-bottom:2.5px solid var(--green-dark);color:var(--green-dark);margin-bottom:-2px">
    📦 Procurement List
  </button>
  <button id="tabPacking" onclick="switchTab('packing')"
    style="padding:10px 20px;font-size:13px;font-weight:600;border:none;background:none;cursor:pointer;border-bottom:2.5px solid transparent;color:var(--ink-soft);margin-bottom:-2px">
    🗂 Packing Orders
  </button>
</div>

<!-- Procurement List -->
<div id="paneProcure">
  <div class="panel">
    <div style="padding:10px 16px;font-size:12px;color:var(--ink-soft);border-bottom:1px solid var(--border);background:var(--green-pale)">
      📦 Total quantities to procure across all subscription orders for this delivery date
    </div>
    <div class="table-wrap">
      <table class="data">
        <thead><tr>
          <th>Product</th>
          <th>Category</th>
          <th>Total Qty (g)</th>
          <th>Total Qty (kg)</th>
          <th>Members</th>
          <th>Est. Product Cost</th>
        </tr></thead>
        <tbody id="procureBody">
          <tr><td colspan="6" class="loading-row"><div class="spinner"></div></td></tr>
        </tbody>
      </table>
    </div>
  </div>
</div>

<!-- Packing Orders -->
<div id="panePacking" style="display:none">
  <div id="packingOrders"></div>
</div>
`;

function switchTab(tab) {
  document.getElementById('paneProcure').style.display  = tab === 'procure' ? '' : 'none';
  document.getElementById('panePacking').style.display  = tab === 'packing' ? '' : 'none';
  ['Procure','Packing'].forEach(t => {
    const el = document.getElementById('tab' + t);
    const active = (t.toLowerCase() === tab) || (t === 'Procure' && tab === 'procure') || (t === 'Packing' && tab === 'packing');
    el.style.borderBottomColor = active ? 'var(--green-dark)' : 'transparent';
    el.style.color             = active ? 'var(--green-dark)' : 'var(--ink-soft)';
  });
}

function statCard(label, value, sub, color) {
  return `
    <div style="display:flex;flex-direction:column;align-items:center;min-width:90px;flex:1">
      <span style="font-family:var(--font-mono);font-size:20px;font-weight:700;color:${color||'var(--green-dark)'}">${value}</span>
      <span style="font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--ink-faint);margin-top:1px">${label}</span>
      ${sub ? `<span style="font-size:10px;color:var(--ink-soft);margin-top:1px">${sub}</span>` : ''}
    </div>`;
}

function divider() {
  return `<div style="width:1px;background:var(--border);align-self:stretch"></div>`;
}

function renderStats(data) {
  const bar = document.getElementById('statsBar');
  bar.style.display = 'block';
  const dt = data.dayTotals || {};
  bar.innerHTML = `
    <div style="display:flex;gap:14px;padding:14px 18px;background:#fff;border:1px solid var(--border);border-radius:12px;flex-wrap:wrap;align-items:center;box-sizing:border-box">
      ${statCard('Members',       data.totalMembers  || 0)}
      ${divider()}
      ${statCard('Families',      data.totalFamilies || 0)}
      ${divider()}
      ${statCard('Orders',        data.totalOrders   || 0)}
      ${divider()}
      ${statCard('Product Cost',  dt.totalProductCost  != null ? '₹'+(+dt.totalProductCost ).toFixed(0) : '–', null, '#555')}
      ${divider()}
      ${statCard('Packaging',     dt.totalPackagingCost!= null ? '₹'+(+dt.totalPackagingCost).toFixed(0) : '–', null, '#555')}
      ${divider()}
      ${statCard('Delivery',      dt.totalDeliveryCost != null ? '₹'+(+dt.totalDeliveryCost ).toFixed(0) : '–', null, '#555')}
      ${divider()}
      ${statCard('Profit',        dt.totalProfitAmount != null ? '₹'+(+dt.totalProfitAmount ).toFixed(0) : '–', null, '#C9A84C')}
      ${divider()}
      ${statCard('Revenue',       dt.totalRevenue      != null ? '₹'+(+dt.totalRevenue      ).toFixed(0) : '–', null, 'var(--green-dark)')}
    </div>`;
}

function renderProcurementList(list) {
  const tbody = document.getElementById('procureBody');
  if (!list?.length) {
    tbody.innerHTML = `<tr><td colspan="6" class="empty" style="text-align:center">
      <div class="icon">📦</div>No subscription orders scheduled for this date
    </td></tr>`;
    return;
  }
  tbody.innerHTML = list.map(item => `<tr>
    <td style="font-weight:600">${escapeHtml(item.name)}</td>
    <td><span style="padding:2px 8px;border-radius:4px;background:var(--green-pale);color:var(--green-dark);font-size:11px">${escapeHtml(item.category||'–')}</span></td>
    <td class="mono" style="font-weight:700;color:var(--green-dark)">${(item.totalGrams||0).toLocaleString('en-IN')} g</td>
    <td class="mono">${((item.totalGrams||0)/1000).toFixed(2)} kg</td>
    <td class="mono">${item.orderCount||0}</td>
    <td class="mono">₹${(item.totalCost||0).toFixed(0)}</td>
  </tr>`).join('');
}

function renderPackingOrders(orders) {
  const wrap = document.getElementById('packingOrders');
  if (!orders?.length) {
    wrap.innerHTML = `<div class="empty"><div class="icon">🗂</div>No subscription orders for this date</div>`;
    return;
  }

  // Group by family
  const byFamily = {};
  orders.forEach(o => {
    const fk = o.familyId?.toString() || 'unknown';
    if (!byFamily[fk]) byFamily[fk] = {
      familyName:  o.familyName,
      phone:       o.phone,
      address:     o.deliveryAddress,
      members:     [],
    };
    byFamily[fk].members.push(o);
  });

  wrap.innerHTML = Object.values(byFamily).map(family => {
    // Family-level totals
    const famRevenue = family.members.reduce((s,o) => s+(o.totalAmount||0), 0);

    return `
    <div style="background:#fff;border:1px solid var(--border);border-radius:12px;margin-bottom:16px;overflow:hidden">

      <!-- Family header -->
      <div style="padding:14px 18px;background:var(--green-pale);border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px">
        <div>
          <div style="font-weight:700;font-size:15px;color:var(--green-dark)">🏠 ${escapeHtml(family.familyName||'Family')}</div>
          <div style="font-size:12px;color:var(--ink-soft);margin-top:3px">
            📞 ${escapeHtml(family.phone||'–')} &nbsp;·&nbsp;
            📍 ${escapeHtml([family.address?.flatNo, family.address?.towerNo, family.address?.apartmentName, family.address?.city].filter(Boolean).join(', ') || '–')}
          </div>
        </div>
        <div style="text-align:right">
          <div style="font-family:var(--font-mono);font-size:16px;font-weight:700;color:var(--green-dark)">₹${famRevenue.toFixed(0)}</div>
          <div style="font-size:11px;color:var(--ink-soft)">${family.members.length} member${family.members.length>1?'s':''}</div>
        </div>
      </div>

      <!-- Per-member rows -->
      ${family.members.map(order => {
        const items = order.basketItems || [];
        const productCost   = order.productCost   ?? items.reduce((s,i) => s+(i.estimatedCost||0), 0);
        const packagingCost = order.packagingCost;
        const deliveryCost  = order.deliveryCost;
        const profitAmount  = order.profitAmount;
        const totalAmount   = order.totalAmount || 0;

        return `
        <div style="padding:14px 18px;border-bottom:1px solid var(--border)">

          <!-- Member header -->
          <div style="display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:8px;margin-bottom:12px">
            <div>
              <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
                <span style="font-weight:700;font-size:14px">👤 ${escapeHtml(order.memberName||'Member')}</span>
                <span style="background:var(--green-pale);color:var(--green-dark);padding:2px 8px;border-radius:4px;font-size:11px;font-weight:600">
                  ${escapeHtml(order.planDisplayName || order.planType || '–')}
                </span>
                <span style="background:#f5f5f5;color:var(--ink-soft);padding:2px 8px;border-radius:4px;font-size:11px">
                  Every ${order.deliveryFreqDays||'?'} days · ${order.durationMonths||'?'} mo
                </span>
              </div>
              <div style="font-size:12px;color:var(--ink-soft);margin-top:4px">
                🕐 ${escapeHtml(order.deliverySlot||'–')} &nbsp;·&nbsp; ${escapeHtml(order.wellnessGoal||'–')}
              </div>
            </div>
            <!-- Cost breakdown chip -->
            <div style="background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:10px 14px;min-width:180px;font-size:12px">
              <div style="display:flex;justify-content:space-between;color:var(--ink-soft);padding:2px 0">
                <span>Product Cost</span>
                <span class="mono">₹${productCost.toFixed(0)}</span>
              </div>
              ${packagingCost != null ? `<div style="display:flex;justify-content:space-between;color:var(--ink-soft);padding:2px 0">
                <span>Packaging</span><span class="mono">₹${(+packagingCost).toFixed(0)}</span></div>` : ''}
              ${deliveryCost != null ? `<div style="display:flex;justify-content:space-between;color:var(--ink-soft);padding:2px 0">
                <span>Delivery</span><span class="mono">₹${(+deliveryCost).toFixed(0)}</span></div>` : ''}
              ${profitAmount != null ? `<div style="display:flex;justify-content:space-between;color:#C9A84C;padding:2px 0">
                <span>Profit</span><span class="mono">₹${(+profitAmount).toFixed(0)}</span></div>` : ''}
              <div style="border-top:1.5px solid var(--border);margin-top:4px;padding-top:5px;display:flex;justify-content:space-between;font-weight:700;color:var(--green-dark)">
                <span>Total</span><span class="mono">₹${totalAmount.toFixed(0)}</span>
              </div>
            </div>
          </div>

          <!-- Basket items -->
          <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:8px">
            ${items.length
              ? items.map(item => `
                <div style="background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:10px">
                  <div style="font-weight:600;font-size:13px">${escapeHtml(item.name||'–')}</div>
                  <div style="font-size:11px;color:var(--ink-soft);margin-top:3px">
                    <span class="mono">${item.quantityG||0} g</span>
                    &nbsp;·&nbsp; ${escapeHtml(item.category||'–')}
                  </div>
                  <div style="font-size:11px;color:var(--ink-faint);margin-top:2px">
                    ₹${(item.pricePer100g||0).toFixed(0)}/100g
                    &nbsp;·&nbsp; est. ₹${(item.estimatedCost||0).toFixed(0)}
                  </div>
                </div>`).join('')
              : `<div style="color:var(--ink-faint);font-size:12px;grid-column:1/-1">No basket items</div>`}
          </div>
        </div>`;
      }).join('')}
    </div>`;
  }).join('');
}

async function load() {
  document.getElementById('procureBody').innerHTML =
    '<tr><td colspan="6" class="loading-row"><div class="spinner"></div></td></tr>';
  document.getElementById('packingOrders').innerHTML =
    '<div style="padding:32px;text-align:center"><div class="spinner"></div></div>';
  document.getElementById('statsBar').style.display = 'none';

  try {
    const data = await adminApi.getProcurementOrders(selectedDate);
    renderStats(data);
    renderProcurementList(data.procurementList || []);
    renderPackingOrders(data.orders || []);
  } catch (e) {
    const msg = escapeHtml(e.message);
    document.getElementById('procureBody').innerHTML =
      `<tr><td colspan="6" class="empty"><div class="icon">⚠️</div>${msg}</td></tr>`;
    document.getElementById('packingOrders').innerHTML =
      `<div class="empty"><div class="icon">⚠️</div>${msg}</div>`;
  }
}

load();
</script>
</body>
</html>
