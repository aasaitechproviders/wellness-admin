<title>Products · KRISHA PURE Admin</title>

<link rel="stylesheet" href="css/admin.css" />
<style>
.tab-bar{display:flex;gap:0;border-bottom:2px solid var(--border);margin-bottom:16px}

.tab-pane{display:none}.tab-pane.active{display:block}

.tag-input-wrap{display:flex;flex-wrap:wrap;gap:6px;padding:7px 10px;border:1px solid var(--border);border-radius:8px;min-height:40px;cursor:text;background:#fff}

<body>

<script>Auth.guardMenu('products');</script>

content.innerHTML=`

      <!-- TAB: BASKET CONFIG -->

          <div class="field"><label>Min Basket (g)</label><input id="fMinBasketG" type="number" placeholder="50"/></div>
          <div class="field"><label>Max Basket (g)</label><input id="fMaxBasketG" type="number" placeholder="500"/></div>

        </div>

          <div class="field"><label>Reviewed At</label><input id="fReviewedAt" type="date"/></div>

          <div class="field"><label>Conditional Review</label><select id="fConditionalReview"><option value="false">No</option><option value="true">Yes</option></select></div>
          <div class="field full"><label>Approval Comments</label><input id="fApprovalComments" placeholder="Any notes from review…"/></div>

        </div>

    </div>
    <div class="modal-foot">
      <button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
      <button class="btn btn-primary" onclick="save()">Save Product</button>
    </div>
  </div>

/* ── Tab switching ── */
function switchTab(name, btn) {
  document.querySelectorAll('.tab-pane').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('tab-' + name).classList.add('active');
  btn.classList.add('active');
}

/* ── Curation Tags ── */
function handleTagKey(e) {
  if (e.key === 'Enter' || e.key === ',') {
    e.preventDefault();
    const val = e.target.value.trim().replace(/,$/, '');
    if (val && !curationTagsList.includes(val)) {
      curationTagsList.push(val);
      renderTags();
    }
    e.target.value = '';
  }
}
function removeTag(tag) {
  curationTagsList = curationTagsList.filter(t => t !== tag);
  renderTags();
}
function renderTags() {
  const wrap = document.getElementById('tagWrap');
  const input = document.getElementById('tagInput');
  wrap.innerHTML = '';
  curationTagsList.forEach(t => {
    const chip = document.createElement('span');
    chip.className = 'tag-chip';
    chip.innerHTML = `${escapeHtml(t)}<button onclick="removeTag('${escapeHtml(t)}')" type="button">×</button>`;
    wrap.appendChild(chip);
  });
  wrap.appendChild(input);
}
function setTags(arr) {
  curationTagsList = Array.isArray(arr) ? [...arr] : [];
  renderTags();
}

/* ── Stats bar ── */
function renderStats(items) {
  if (!items || !items.length) return;
  const active = items.filter(i => i.isActive).length;
  const withImg = items.filter(i => i.imageUrl).length;
  const approved = items.filter(i => i.approvalStatus === 'Approved').length;
  const el = document.getElementById('statsBar');
  if (!el) return;
  const stat = (val, label, color='var(--green)') =>
    `<div style="display:flex;flex-direction:column;align-items:center;min-width:52px">
      <span style="font-family:var(--font-mono);font-size:22px;font-weight:700;color:${color};line-height:1">${val}</span>
      <span style="font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--ink-faint);margin-top:2px">${label}</span>
    </div>`;
  const div = (h='var(--border)') => `<div style="width:1px;background:${h};align-self:stretch"></div>`;
  el.innerHTML = `<div style="display:flex;gap:14px;padding:12px 16px;background:#fff;border:1px solid var(--border);border-radius:10px;margin-bottom:14px;flex-wrap:wrap;align-items:center">
    ${stat(items.length,'Total')}${div()}${stat(active,'Active')}${div()}
    ${stat(items.length-active,'Inactive','#C9A84C')}${div()}
    ${stat(approved,'Approved')}${div()}
    ${stat(withImg,'With Image','var(--ink-soft)')}
  </div>`;
}

/* ── Load & filter ── */
async function load() {
  document.getElementById('tbody').innerHTML = '<tr><td colspan="14" class="loading-row"><span class="spinner"></span></td></tr>';
  try {
    const d = await adminApi.getProducts({ limit: 1000 });
    allProducts = d.products || [];
    renderStats(allProducts);
    applyFilter();
  } catch(e) { showToast(e.message, 'error'); }
}

function applyFilter() {
  const q   = (document.getElementById('srch').value || '').toLowerCase();
  const cat = document.getElementById('catFilter').value;
  const st  = document.getElementById('statusFilter').value;
  filtered  = allProducts.filter(p => {
    if (cat && p.category !== cat) return false;
    if (st  && String(p.isActive) !== st) return false;
    if (q && !((p.name||'').toLowerCase().includes(q) || (p.category||'').toLowerCase().includes(q) || (p.productId||'').toLowerCase().includes(q) || (p.curationNotes||'').toLowerCase().includes(q))) return false;
    return true;
  });
  page = 1; render();
}

function approvalBadge(s) {
  const map = { Approved:'pill-active', Pending:'pill-warn', Rejected:'pill-inactive', Reviewed:'pill-info' };
  return `<span class="pill ${map[s]||''}">${s||'–'}</span>`;
}

function render() {
  document.getElementById('countBadge').textContent = `${filtered.length} products`;
  const start = (page - 1) * perPage, slice = filtered.slice(start, start + perPage);
  document.getElementById('pgInfo').textContent = `${start+1}–${Math.min(start+perPage,filtered.length)} of ${filtered.length}`;
  document.getElementById('prevBtn').disabled = page === 1;
  document.getElementById('nextBtn').disabled = start + perPage >= filtered.length;
  document.getElementById('tbody').innerHTML = slice.map(p => `
    <tr>
      <td class="mono">${escapeHtml(p.productId||'')}</td>
      <td><b>${escapeHtml(p.name||'')}</b>${p.isNonVeg?'<span style="color:#C62828;font-size:10px;margin-left:4px">🥩NV</span>':''}</td>
      <td>${escapeHtml(p.category||'')}</td>
      <td class="num">${p.nutrition?.calories??'–'}</td>
      <td class="num">${p.nutrition?.protein??'–'}</td>
      <td class="num">${p.nutrition?.fiber??'–'}</td>
      <td class="num">${p.nutrition?.gi??'–'}</td>
      <td class="num" style="font-size:11px">${p.minBasketG??'–'} / ${p.typicalServingG??'–'} / ${p.maxBasketG??'–'}</td>
      <td class="num">${p.wellnessScores?.diabetes??'–'}</td>
      <td class="num">${p.wellnessScores?.weightLoss??'–'}</td>
      <td class="num">${p.wellnessScores?.immunity??'–'}</td>
      <td>${approvalBadge(p.approvalStatus)}</td>
      <td><span class="pill ${p.isActive?'pill-active':'pill-inactive'}">${p.isActive?'Active':'Inactive'}</span></td>
      <td>
        <button class="btn btn-ghost btn-sm" onclick='openModal(${JSON.stringify(p)})'>Edit</button>
        <button class="btn btn-danger btn-sm" onclick="del('${p._id}')">Del</button>
      </td>
    </tr>`).join('') || '<tr><td colspan="14" class="empty">No products found</td></tr>';
}

function changePage(d) { page += d; render(); }

/* ── Open modal ── */
function openModal(p) {
  editId = p ? p._id : null;
  document.getElementById('modalTitle').textContent = p ? 'Edit Product' : 'Add Product';
  // Reset to first tab
  switchTab('basics', document.querySelector('.tab-btn'));

  const n  = p?.nutrition     || {};
  const s  = p?.wellnessScores|| {};
  const su = p?.suitability   || {};

  // Basics
  sv('fProductId',        p?.productId         || '');
  sv('fName',             p?.name              || '');
  sv('fCategory',         p?.category          || CATEGORIES[0]);
  sv('fSeasonal',         p?.seasonal          || 'Year-round');
  sv('fPrice',            p?.pricePer100g      ?? '');
  sv('fCurrentPrice',     p?.currentPricePer100g ?? '');
  sv('fUnit',             p?.servingUnit       || 'g');
  sv('fShelf',            p?.shelfLife         || '');
  sv('fStorage',          p?.storageType       || 'Refrigerated');
  sv('fPremium',          p?.premiumPositioning|| '');
  sv('fBasis',            p?.nutritionDataBasis|| 'Per 100g edible portion – raw');
  sv('fTaste',            p?.tasteProfile      || '');
  sv('fIsActive',         p?.isActive === false ? 'false' : 'true');
  sv('fIsNonVeg',         p?.isNonVeg  === true  ? 'true'  : 'false');
  sv('fHardExclusion',    p?.hardExclusion === true ? 'true' : 'false');
  sv('fMicro',            p?.microgreenCompatible === false ? 'false' : 'true');
  sv('fKid',              p?.kidFriendly      || su.kidFriendly      || 'Yes');
  sv('fSenior',           p?.seniorFriendly   || su.seniorFriendly   || 'Yes');
  sv('fDiabFr',           p?.diabeticFriendly || su.diabeticFriendly || 'Excellent');
  sv('fSalad',            su.salad    || 'Excellent');
  sv('fJuice',            su.juice    || 'Moderate');
  sv('fCook',             su.cooking  || 'Both');
  sv('fCurationNotes',    p?.curationNotes || '');
  sv('fBestFor',          p?.bestFor       || '');
  setTags(p?.curationTags || []);

  // Nutrition
  sv('fCal',      n.calories      ?? ''); sv('fCarbs',    n.carbs         ?? '');
  sv('fFiber',    n.fiber         ?? ''); sv('fProtein',  n.protein       ?? '');
  sv('fFat',      n.fat           ?? ''); sv('fSugar',    n.sugar         ?? '');
  sv('fSatFat',   n.saturatedFat_g?? ''); sv('fUnsatFat', n.unsaturatedFat_g??'');
  sv('fAddSugar', n.addedSugar_g  ?? ''); sv('fGI',       n.gi            ?? '');
  sv('fGL',       n.gl            ?? ''); sv('fIron',     n.iron_mg       ?? '');
  sv('fCalcium',  n.calcium_mg    ?? ''); sv('fMag',      n.magnesium_mg  ?? '');
  sv('fPot',      n.potassium_mg  ?? ''); sv('fVitC',     n.vitaminC_mg   ?? '');
  sv('fVitA',     n.vitaminA_ug   ?? ''); sv('fZinc',     n.zinc_mg       ?? '');
  sv('fSodium',   n.sodium_mg     ?? '');

  // Wellness scores
  sv('sDiab',   s.diabetes          ?? ''); sv('sWt',    s.weightLoss      ?? '');
  sv('sImm',    s.immunity          ?? ''); sv('sDetox', s.detox           ?? '');
  sv('sSat',    s.satiety           ?? ''); sv('sAnti',  s.antiInflammatory?? '');
  sv('sHeart',  s.heartHealth       ?? ''); sv('sBone',  s.boneHealth      ?? '');
  sv('sIron',   s.ironSupport       ?? '');
  sv('fSysDiab', p?.systemDiabetesStatus  || '');
  sv('fSysWt',   p?.systemWeightLossStatus|| '');

  // Basket config
  sv('fTypicalServing',  p?.typicalServingG  ?? '');
  sv('fMinBasketG',      p?.minBasketG       ?? '');
  sv('fMaxBasketG',      p?.maxBasketG       ?? '');
  sv('fMaxServingsWeek', p?.maxServingsWeek  ?? '');

  // Approval
  sv('fApprovalStatus',    p?.approvalStatus    || 'Pending');
  sv('fReviewedBy',        p?.reviewedBy        || '');
  sv('fReviewedAt',        p?.reviewedAt ? p.reviewedAt.split('T')[0] : '');
  sv('fNutrApproved',      p?.nutritionistApproved === true ? 'true' : 'false');
  sv('fConditionalReview', p?.conditionalReview === true    ? 'true' : 'false');
  sv('fApprovalComments',  p?.approvalComments  || '');
  sv('fImageUrl',          p?.imageUrl          || '');

  document.getElementById('modal').style.display = 'flex';
}

function closeModal() { document.getElementById('modal').style.display = 'none'; editId = null; curationTagsList = []; }

function sv(id, val) { const el = document.getElementById(id); if (el) el.value = val ?? ''; }
function g(id)       { const v = document.getElementById(id)?.value; return v === '' ? null : v; }
function gn(id)      { const v = document.getElementById(id)?.value; return v === '' ? null : parseFloat(v); }
function gb(id)      { return document.getElementById(id)?.value === 'true'; }

async function save() {
  const body = {
    productId:            g('fProductId'),
    name:                 g('fName'),
    category:             g('fCategory'),
    pricePer100g:         gn('fPrice'),
    currentPricePer100g:  gn('fCurrentPrice'),
    servingUnit:          g('fUnit'),
    seasonal:             g('fSeasonal'),
    shelfLife:            g('fShelf'),
    storageType:          g('fStorage'),
    premiumPositioning:   g('fPremium'),
    nutritionDataBasis:   g('fBasis'),
    tasteProfile:         g('fTaste'),
    bestFor:              g('fBestFor'),
    curationNotes:        g('fCurationNotes'),
    curationTags:         [...curationTagsList],
    isActive:             gb('fIsActive'),
    isNonVeg:             gb('fIsNonVeg'),
    hardExclusion:        gb('fHardExclusion'),
    microgreenCompatible: gb('fMicro'),
    kidFriendly:          g('fKid'),
    seniorFriendly:       g('fSenior'),
    diabeticFriendly:     g('fDiabFr'),
    typicalServingG:      gn('fTypicalServing'),
    minBasketG:           gn('fMinBasketG'),
    maxBasketG:           gn('fMaxBasketG'),
    maxServingsWeek:      gn('fMaxServingsWeek'),
    approvalStatus:       g('fApprovalStatus'),
    reviewedBy:           g('fReviewedBy'),
    reviewedAt:           g('fReviewedAt') ? new Date(g('fReviewedAt')).toISOString() : null,
    nutritionistApproved: gb('fNutrApproved'),
    conditionalReview:    gb('fConditionalReview'),
    approvalComments:     g('fApprovalComments'),
    imageUrl:             g('fImageUrl'),
    systemDiabetesStatus:   g('fSysDiab'),
    systemWeightLossStatus: g('fSysWt'),
    nutrition: {
      calories:          gn('fCal'),   carbs:          gn('fCarbs'),
      fiber:             gn('fFiber'), protein:        gn('fProtein'),
      fat:               gn('fFat'),   sugar:          gn('fSugar'),
      gi:                gn('fGI'),    gl:             gn('fGL'),
      iron_mg:           gn('fIron'),  calcium_mg:     gn('fCalcium'),
      magnesium_mg:      gn('fMag'),   potassium_mg:   gn('fPot'),
      vitaminC_mg:       gn('fVitC'),  vitaminA_ug:    gn('fVitA'),
      zinc_mg:           gn('fZinc'),  sodium_mg:      gn('fSodium'),
      saturatedFat_g:    gn('fSatFat'),unsaturatedFat_g:gn('fUnsatFat'),
      addedSugar_g:      gn('fAddSugar'),
    },
    wellnessScores: {
      diabetes:          gn('sDiab'),  weightLoss:      gn('sWt'),
      immunity:          gn('sImm'),   detox:           gn('sDetox'),
      satiety:           gn('sSat'),   antiInflammatory:gn('sAnti'),
      heartHealth:       gn('sHeart'), boneHealth:      gn('sBone'),
      ironSupport:       gn('sIron'),
    },
    suitability: {
      salad:    g('fSalad'), juice:   g('fJuice'), cooking: g('fCook'),
    },
  };
  if (!body.name) { showToast('Name is required', 'error'); return; }
  try {
    if (editId) await adminApi.updateProduct(editId, body);
    else        await adminApi.createProduct(body);
    showToast(editId ? 'Product updated' : 'Product created', 'success');
    closeModal(); load();
  } catch(e) { showToast(e.message, 'error'); }
}

async function del(id) {
  if (!confirm('Delete this product?')) return;
  try { await adminApi.deleteProduct(id); showToast('Deleted', 'success'); load(); }
  catch(e) { showToast(e.message, 'error'); }
}

load();
</script>
</body>
</html>
