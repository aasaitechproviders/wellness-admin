<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Products · KRISHA PURE Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=DM+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="css/admin.css" />
</head>
<body>
<script src="js/api.js"></script>
<script>Auth.guardMenu('products');</script>
<script src="js/sidebar.js"></script>
<script>
const content = renderShell({ active:'products', title:'Products', sub:'Nutrition master data — 143 produce items with full nutrient profiles', actions:`<button class="btn btn-primary" onclick="openModal()">+ Add Product</button>` });

let allProducts=[], filtered=[], page=1, perPage=25, editId=null;
const CATEGORIES=['Leafy Vegetables','Fruits','Microgreens','Roots & Tubers','Gourds','Beans & Legumes','Herbs & Spices','Other'];

content.innerHTML=`
<div class="toolbar">
  <input type="search" id="srch" placeholder="Search by name, category…" oninput="applyFilter()"/>
  <select id="catFilter" onchange="applyFilter()"><option value="">All Categories</option>${CATEGORIES.map(c=>`<option>${c}</option>`).join('')}</select>
  <div class="spacer"></div>
  <span id="countBadge" class="muted" style="font-size:12px"></span>
</div>
<div class="panel">
  <div class="table-wrap">
    <table class="data">
      <thead><tr>
        <th>ID</th><th>Name</th><th>Category</th><th>Cal/100g</th><th>Protein</th><th>GI</th>
        <th>Diabetes</th><th>Wt.Loss</th><th>Immunity</th><th>Status</th><th></th>
      </tr></thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>
  <div class="pagination"><span id="pgInfo"></span>
    <button id="prevBtn" onclick="changePage(-1)">&#8592;</button>
    <button id="nextBtn" onclick="changePage(1)">&#8594;</button>
  </div>
</div>
<div class="modal-backdrop" id="modal" style="display:none" onclick="if(event.target===this)closeModal()">
  <div class="modal wide">
    <div class="modal-head"><h3 id="modalTitle">Add Product</h3><button class="modal-close" onclick="closeModal()">✕</button></div>
    <div style="overflow-y:auto;max-height:70vh">
      <div class="form-grid">
        <div class="field"><label>Product ID</label><input id="fProductId" placeholder="Prod_001"/></div>
        <div class="field"><label>Name *</label><input id="fName" placeholder="Spinach"/></div>
        <div class="field"><label>Category</label><select id="fCategory">${CATEGORIES.map(c=>`<option>${c}</option>`).join('')}</select></div>
        <div class="field"><label>Price per 100g (₹)</label><input id="fPrice" type="number" step="0.01"/></div>
        <div class="field"><label>Serving Unit</label><input id="fUnit" placeholder="g"/></div>
        <div class="field"><label>Seasonal</label><input id="fSeasonal" placeholder="Year-round"/></div>
      </div>
      <p class="panel-title" style="margin-top:10px">Nutrition per 100g</p>
      <div class="form-grid">
        <div class="field"><label>Calories (kcal)</label><input id="fCal" type="number"/></div>
        <div class="field"><label>Carbs (g)</label><input id="fCarbs" type="number" step="0.1"/></div>
        <div class="field"><label>Fiber (g)</label><input id="fFiber" type="number" step="0.1"/></div>
        <div class="field"><label>Protein (g)</label><input id="fProtein" type="number" step="0.1"/></div>
        <div class="field"><label>Fat (g)</label><input id="fFat" type="number" step="0.1"/></div>
        <div class="field"><label>Sugar (g)</label><input id="fSugar" type="number" step="0.1"/></div>
        <div class="field"><label>GI</label><input id="fGI" type="number"/></div>
        <div class="field"><label>GL</label><input id="fGL" type="number" step="0.1"/></div>
        <div class="field"><label>Iron (mg)</label><input id="fIron" type="number" step="0.01"/></div>
        <div class="field"><label>Calcium (mg)</label><input id="fCalcium" type="number"/></div>
        <div class="field"><label>Magnesium (mg)</label><input id="fMag" type="number"/></div>
        <div class="field"><label>Potassium (mg)</label><input id="fPot" type="number"/></div>
        <div class="field"><label>Vitamin C (mg)</label><input id="fVitC" type="number" step="0.1"/></div>
        <div class="field"><label>Sodium (mg)</label><input id="fSodium" type="number" step="0.01"/></div>
        <div class="field"><label>Saturated Fat (g)</label><input id="fSatFat" type="number" step="0.001"/></div>
        <div class="field"><label>Added Sugar (g)</label><input id="fAddSugar" type="number" step="0.01"/></div>
        <div class="field"><label>Zinc (mg)</label><input id="fZinc" type="number" step="0.01"/></div>
        <div class="field"><label>Vitamin A (µg RAE)</label><input id="fVitA" type="number" step="0.01"/></div>
        <div class="field"><label>Unsaturated Fat (g)</label><input id="fUnsatFat" type="number" step="0.001"/></div>
      </div>
      <p class="panel-title" style="margin-top:10px">Wellness Scores (0–100)</p>
      <div class="form-grid">
        <div class="field"><label>Diabetes Score</label><input id="sDiab" type="number" min="0" max="100"/></div>
        <div class="field"><label>Weight Loss Score</label><input id="sWt" type="number" min="0" max="100"/></div>
        <div class="field"><label>Immunity Score</label><input id="sImm" type="number" min="0" max="100"/></div>
        <div class="field"><label>Detox Score</label><input id="sDetox" type="number" min="0" max="100"/></div>
        <div class="field"><label>Satiety Score</label><input id="sSat" type="number" min="0" max="100"/></div>
        <div class="field"><label>Anti-Inflammatory Score</label><input id="sAnti" type="number" min="0" max="100"/></div>
      </div>
      <p class="panel-title" style="margin-top:10px">Suitability & Profile</p>
      <div class="form-grid">
        <div class="field"><label>Taste Profile</label><input id="fTaste" placeholder="Mild/Earthy"/></div>
        <div class="field"><label>Best For</label><input id="fBestFor" placeholder="Iron, Detox"/></div>
        <div class="field"><label>Salad Suitability</label><input id="fSalad" placeholder="Excellent"/></div>
        <div class="field"><label>Juice Suitability</label><input id="fJuice" placeholder="Good"/></div>
        <div class="field"><label>Cooking Suitability</label><input id="fCook" placeholder="Both"/></div>
        <div class="field"><label>Shelf Life</label><input id="fShelf" placeholder="2–5 days"/></div>
        <div class="field"><label>Storage Type</label><input id="fStorage" placeholder="Refrigerated"/></div>
        <div class="field"><label>Kid Friendly</label><select id="fKid"><option>Yes</option><option>Moderate</option><option>No</option></select></div>
        <div class="field"><label>Senior Friendly</label><select id="fSenior"><option>Yes</option><option>Moderate</option><option>No</option></select></div>
        <div class="field"><label>Diabetic Friendly</label><select id="fDiabFr"><option>Excellent</option><option>Good</option><option>Moderate</option><option>No</option></select></div>
        <div class="field"><label>Microgreen Compatible</label><select id="fMicro"><option>Yes</option><option>No</option></select></div>
        <div class="field full"><label>Premium Positioning</label><input id="fPremium" placeholder="Iron-Rich Detox Greens"/></div>
        <div class="field full"><label>Nutrition Data Basis</label><input id="fBasis" placeholder="Per 100g edible portion – raw"/></div>
      </div>
    </div>
    <div class="modal-foot">
      <button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
      <button class="btn btn-primary" onclick="save()">Save</button>
    </div>
  </div>
</div>`;

async function load(){
  document.getElementById('tbody').innerHTML='<tr><td colspan="11" class="loading-row"><span class="spinner"></span></td></tr>';
  try{
    const d=await adminApi.getProducts({limit:500});
    allProducts=d.products||[];
    applyFilter();
  }catch(e){showToast(e.message,'error');}
}

function applyFilter(){
  const q=(document.getElementById('srch').value||'').toLowerCase();
  const cat=document.getElementById('catFilter').value;
  filtered=allProducts.filter(p=>{
    if(cat&&p.category!==cat)return false;
    if(q&&!((p.name||'').toLowerCase().includes(q)||(p.category||'').toLowerCase().includes(q)||(p.productId||'').toLowerCase().includes(q)))return false;
    return true;
  });
  page=1;render();
}

function render(){
  document.getElementById('countBadge').textContent=`${filtered.length} products`;
  const start=(page-1)*perPage, slice=filtered.slice(start,start+perPage);
  document.getElementById('pgInfo').textContent=`${start+1}–${Math.min(start+perPage,filtered.length)} of ${filtered.length}`;
  document.getElementById('prevBtn').disabled=page===1;
  document.getElementById('nextBtn').disabled=start+perPage>=filtered.length;
  document.getElementById('tbody').innerHTML=slice.map(p=>`
    <tr>
      <td class="mono">${escapeHtml(p.productId||'')}</td>
      <td><b>${escapeHtml(p.name||'')}</b></td>
      <td>${escapeHtml(p.category||'')}</td>
      <td class="num">${p.nutrition?.calories??'–'}</td>
      <td class="num">${p.nutrition?.protein??'–'}</td>
      <td class="num">${p.nutrition?.gi??'–'}</td>
      <td class="num">${p.wellnessScores?.diabetes??'–'}</td>
      <td class="num">${p.wellnessScores?.weightLoss??'–'}</td>
      <td class="num">${p.wellnessScores?.immunity??'–'}</td>
      <td><span class="pill ${p.isActive?'pill-active':'pill-inactive'}">${p.isActive?'Active':'Inactive'}</span></td>
      <td>
        <button class="btn btn-ghost btn-sm" onclick='openModal(${JSON.stringify(p)})'>Edit</button>
        <button class="btn btn-danger btn-sm" onclick="del('${p._id}')">Del</button>
      </td>
    </tr>`).join('')||'<tr><td colspan="11" class="empty">No products found</td></tr>';
}

function changePage(d){page+=d;render();}

function openModal(p){
  editId=p?p._id:null;
  document.getElementById('modalTitle').textContent=p?'Edit Product':'Add Product';
  const n=p?.nutrition||{},s=p?.wellnessScores||{},su=p?.suitability||{};
  document.getElementById('fProductId').value=p?.productId||'';
  document.getElementById('fName').value=p?.name||'';
  document.getElementById('fCategory').value=p?.category||CATEGORIES[0];
  document.getElementById('fPrice').value=p?.pricePer100g||'';
  document.getElementById('fUnit').value=p?.servingUnit||'g';
  document.getElementById('fSeasonal').value=p?.seasonal||'';
  document.getElementById('fCal').value=n.calories||'';
  document.getElementById('fCarbs').value=n.carbs||'';
  document.getElementById('fFiber').value=n.fiber||'';
  document.getElementById('fProtein').value=n.protein||'';
  document.getElementById('fFat').value=n.fat||'';
  document.getElementById('fSugar').value=n.sugar||'';
  document.getElementById('fGI').value=n.gi||'';
  document.getElementById('fGL').value=n.gl||'';
  document.getElementById('fIron').value=n.iron_mg||'';
  document.getElementById('fCalcium').value=n.calcium_mg||'';
  document.getElementById('fMag').value=n.magnesium_mg||'';
  document.getElementById('fPot').value=n.potassium_mg||'';
  document.getElementById('fVitC').value=n.vitaminC_mg||'';
  document.getElementById('fSodium').value=n.sodium_mg||'';
  document.getElementById('fSatFat').value=n.saturatedFat_g||'';
  document.getElementById('fAddSugar').value=n.addedSugar_g||'';
  document.getElementById('fZinc').value=n.zinc_mg||'';
  document.getElementById('fVitA').value=n.vitaminA_ug||'';
  document.getElementById('fUnsatFat').value=n.unsaturatedFat_g||'';
  document.getElementById('sDiab').value=s.diabetes||'';
  document.getElementById('sWt').value=s.weightLoss||'';
  document.getElementById('sImm').value=s.immunity||'';
  document.getElementById('sDetox').value=s.detox||'';
  document.getElementById('sSat').value=s.satiety||'';
  document.getElementById('sAnti').value=s.antiInflammatory||'';
  document.getElementById('fTaste').value=p?.tasteProfile||'';
  document.getElementById('fBestFor').value=p?.bestFor||'';
  document.getElementById('fSalad').value=su.salad||'';
  document.getElementById('fJuice').value=su.juice||'';
  document.getElementById('fCook').value=su.cooking||'';
  document.getElementById('fShelf').value=p?.shelfLife||'';
  document.getElementById('fStorage').value=p?.storageType||'';
  document.getElementById('fKid').value=su.kidFriendly||'Yes';
  document.getElementById('fSenior').value=su.seniorFriendly||'Yes';
  document.getElementById('fDiabFr').value=su.diabeticFriendly||'Excellent';
  document.getElementById('fMicro').value=su.microgreenCompatible||'Yes';
  document.getElementById('fPremium').value=p?.premiumPositioning||'';
  document.getElementById('fBasis').value=p?.nutritionDataBasis||'Per 100g edible portion – raw';
  document.getElementById('modal').style.display='flex';
}

function closeModal(){document.getElementById('modal').style.display='none';editId=null;}

function g(id){const v=document.getElementById(id).value;return v===''?null:v;}
function gn(id){const v=document.getElementById(id).value;return v===''?null:parseFloat(v);}

async function save(){
  const body={
    productId:g('fProductId'),name:g('fName'),category:g('fCategory'),
    pricePer100g:gn('fPrice'),servingUnit:g('fUnit'),seasonal:g('fSeasonal'),
    nutrition:{calories:gn('fCal'),carbs:gn('fCarbs'),fiber:gn('fFiber'),protein:gn('fProtein'),
      fat:gn('fFat'),sugar:gn('fSugar'),gi:gn('fGI'),gl:gn('fGL'),iron_mg:gn('fIron'),
      calcium_mg:gn('fCalcium'),magnesium_mg:gn('fMag'),potassium_mg:gn('fPot'),
      vitaminC_mg:gn('fVitC'),sodium_mg:gn('fSodium'),saturatedFat_g:gn('fSatFat'),
      addedSugar_g:gn('fAddSugar'),zinc_mg:gn('fZinc'),vitaminA_ug:gn('fVitA'),unsaturatedFat_g:gn('fUnsatFat')},
    wellnessScores:{diabetes:gn('sDiab'),weightLoss:gn('sWt'),immunity:gn('sImm'),
      detox:gn('sDetox'),satiety:gn('sSat'),antiInflammatory:gn('sAnti')},
    suitability:{salad:g('fSalad'),juice:g('fJuice'),cooking:g('fCook'),
      kidFriendly:g('fKid'),seniorFriendly:g('fSenior'),diabeticFriendly:g('fDiabFr'),microgreenCompatible:g('fMicro')},
    tasteProfile:g('fTaste'),bestFor:g('fBestFor'),shelfLife:g('fShelf'),storageType:g('fStorage'),
    premiumPositioning:g('fPremium'),nutritionDataBasis:g('fBasis'),
  };
  if(!body.name){showToast('Name is required','error');return;}
  try{
    if(editId)await adminApi.updateProduct(editId,body);
    else await adminApi.createProduct(body);
    showToast(editId?'Product updated':'Product created','success');
    closeModal();load();
  }catch(e){showToast(e.message,'error');}
}

async function del(id){
  if(!confirm('Delete this product?'))return;
  try{await adminApi.deleteProduct(id);showToast('Deleted','success');load();}
  catch(e){showToast(e.message,'error');}
}

load();
</script>
</body>
</html>
