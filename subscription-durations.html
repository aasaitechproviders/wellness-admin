<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Subscription Durations · KRISHA PURE Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=DM+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="css/admin.css"/></head><body>
<script src="js/api.js"></script><script>Auth.guardMenu('subscription-durations');</script>
<script src="js/sidebar.js"></script>
<script>
const content = renderShell({
  active: 'subscription-durations',
  title: 'Subscription Durations',
  sub: 'Define subscription plan lengths — the default plan is pre-selected during customer checkout',
  actions: `<button class="btn btn-primary" onclick="openModal()">+ Add Duration</button>`
});

let items = [], editId = null;

content.innerHTML = `
<div class="panel">
  <div class="toolbar">
    <input type="search" id="srch" placeholder="Search…" oninput="render()"/>
    <div class="spacer"></div>
    <span id="cnt" class="muted" style="font-size:12px"></span>
  </div>
  <div class="table-wrap"><table class="data">
    <thead><tr>
      <th>Label</th><th>Duration (months)</th><th>Discount %</th><th>Sort Order</th><th>Active</th><th>Default</th><th></th>
    </tr></thead>
    <tbody id="tbody"></tbody>
  </table></div>
</div>

<div class="modal-backdrop" id="modal" style="display:none" onclick="if(event.target===this)closeModal()">
<div class="modal"><div class="modal-head"><h3 id="mTitle">Add Duration</h3><button class="modal-close" onclick="closeModal()">✕</button></div>
<div class="form-grid" style="padding:4px 0 12px">
  <div class="field"><label>Label *</label><input id="fLabel" placeholder="e.g. 1 Month"/></div>
  <div class="field"><label>Duration (months) *</label><input id="fMonths" type="number" min="1" placeholder="1"/></div>
  <div class="field"><label>Discount %</label><input id="fDiscount" type="number" min="0" max="100" step="0.01" placeholder="0"/></div>
  <div class="field"><label>Sort Order</label><input id="fSort" type="number" min="1" placeholder="1"/></div>
  <div class="field"><label>Active</label><select id="fIsActive"><option value="true">Yes</option><option value="false">No</option></select></div>
  <div class="field"><label>Set as Default</label><select id="fIsDefault"><option value="false">No</option><option value="true">Yes</option></select></div>
</div>
<div class="modal-foot"><button class="btn btn-ghost" onclick="closeModal()">Cancel</button><button class="btn btn-primary" onclick="save()">Save</button></div>
</div></div>`;

async function load() {
  document.getElementById('tbody').innerHTML = '<tr><td colspan="7" class="loading-row"><span class="spinner"></span></td></tr>';
  try {
    const d = await adminApi.getSubscriptionDurations();
    items = d.subscriptionDurations || d.durations || d.items || [];
    render();
  } catch(e) { showToast(e.message, 'error'); }
}

function render() {
  const q = (document.getElementById('srch').value||'').toLowerCase();
  const f = items.filter(i => !q || JSON.stringify(i).toLowerCase().includes(q));
  document.getElementById('cnt').textContent = `${f.length} duration${f.length!==1?'s':''}`;
  document.getElementById('tbody').innerHTML = f.map(i => `<tr>
    <td><b>${escapeHtml(i.label||'')}</b></td>
    <td style="text-align:center">${i.durationMonths}</td>
    <td style="text-align:center">${i.discountPct ?? 0}%</td>
    <td style="text-align:center">${i.sortOrder ?? '–'}</td>
    <td><span class="pill ${i.isActive!==false?'pill-active':'pill-inactive'}">${i.isActive!==false?'Yes':'No'}</span></td>
    <td style="text-align:center">${i.isDefault ? '<span class="pill pill-placed">★ Default</span>' : '<button class="btn btn-ghost btn-sm" onclick="setDefault(\''+i._id+'\')">☆ Set</button>'}</td>
    <td>
      <button class="btn btn-ghost btn-sm" onclick='openModal(${JSON.stringify(i)})'>Edit</button>
      <button class="btn btn-danger btn-sm" onclick="del('${i._id}')">Del</button>
    </td>
  </tr>`).join('') || '<tr><td colspan="7" class="empty">No durations found.</td></tr>';
}

function g(id) { const v = document.getElementById(id)?.value; return (v===''||v===undefined) ? null : v; }

function openModal(i) {
  editId = i ? i._id : null;
  document.getElementById('mTitle').textContent = i ? 'Edit Duration' : 'Add Duration';
  document.getElementById('fLabel').value    = i?.label          || '';
  document.getElementById('fMonths').value   = i?.durationMonths || '';
  document.getElementById('fDiscount').value = i?.discountPct    ?? 0;
  document.getElementById('fSort').value     = i?.sortOrder      || '';
  document.getElementById('fIsActive').value = i?.isActive === false ? 'false' : 'true';
  document.getElementById('fIsDefault').value= i?.isDefault ? 'true' : 'false';
  document.getElementById('modal').style.display = 'flex';
}
function closeModal() { document.getElementById('modal').style.display = 'none'; editId = null; }

async function save() {
  const label  = g('fLabel');
  const months = parseInt(document.getElementById('fMonths').value);
  if (!label)           { showToast('Label is required', 'error'); return; }
  if (!months || months < 1) { showToast('Duration (months) is required', 'error'); return; }
  const body = {
    label,
    durationMonths: months,
    discountPct:    parseFloat(document.getElementById('fDiscount').value) || 0,
    sortOrder:      parseInt(document.getElementById('fSort').value)       || 99,
    isActive:       document.getElementById('fIsActive').value  === 'true',
    isDefault:      document.getElementById('fIsDefault').value === 'true',
  };
  try {
    if (editId) await adminApi.updateSubscriptionDuration(editId, body);
    else        await adminApi.createSubscriptionDuration(body);
    showToast(editId ? 'Updated' : 'Created', 'success');
    closeModal(); load();
  } catch(e) { showToast(e.message, 'error'); }
}

async function setDefault(id) {
  if (!confirm('Set this as the default subscription duration?')) return;
  try {
    await adminApi.setDefaultSubscriptionDuration(id);
    showToast('Default updated', 'success'); load();
  } catch(e) { showToast(e.message, 'error'); }
}

async function del(id) {
  if (!confirm('Delete this duration?')) return;
  try { await adminApi.deleteSubscriptionDuration(id); showToast('Deleted', 'success'); load(); }
  catch(e) { showToast(e.message, 'error'); }
}
load();
</script></body></html>
