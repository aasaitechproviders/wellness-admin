<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Delivery Frequency · KRISHA PURE Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=DM+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="css/admin.css"/></head><body>
<script src="js/api.js"></script><script>Auth.guardMenu('subscription-plans');</script>
<script src="js/sidebar.js"></script>
<script>
const content = renderShell({
  active: 'subscription-plans',
  title: 'Delivery Frequency',
  sub: 'Subscription plan frequency options shown to customers — weekly, alternate days, monthly etc.',
  actions: `<button class="btn btn-primary" onclick="openModal()">+ Add Plan</button>`
});

let items = [], editId = null;

content.innerHTML = `
<div class="panel">
  <div class="toolbar">
    <input type="search" id="srch" placeholder="Search…" oninput="render()"/>
    <div class="spacer"></div>
    <span id="cnt" class="muted" style="font-size:12px"></span>
  </div>
  <div class="table-wrap"><table class="data">
    <thead><tr>
      <th>Sort</th><th>Plan ID</th><th>Plan Name</th><th>Frequency Label</th><th>Duration Days</th><th>Active</th><th></th>
    </tr></thead>
    <tbody id="tbody"></tbody>
  </table></div>
</div>

<div class="modal-backdrop" id="modal" style="display:none" onclick="if(event.target===this)closeModal()">
<div class="modal"><div class="modal-head"><h3 id="mTitle">Add Delivery Plan</h3><button class="modal-close" onclick="closeModal()">✕</button></div>
<div class="form-grid" style="padding:4px 0 12px">
  <div class="field"><label>Plan ID * <span class="opt">slug, e.g. weekly</span></label><input id="fPlanId" placeholder="weekly"/></div>
  <div class="field"><label>Plan Name *</label><input id="fPlanName" placeholder="Weekly Plan"/></div>
  <div class="field"><label>Frequency Label <span class="opt">shown to customer</span></label><input id="fFrequencyLabel" placeholder="Every 7 days"/></div>
  <div class="field"><label>Duration Days</label><input id="fDurationDays" type="number" min="1" placeholder="7"/></div>
  <div class="field"><label>Sort Order</label><input id="fSortOrder" type="number" min="1" placeholder="1"/></div>
  <div class="field"><label>Active</label><select id="fIsActive"><option value="true">Yes</option><option value="false">No</option></select></div>
  <div class="field full"><label>Description</label><textarea id="fDescription" rows="2" placeholder="Fresh basket delivered every week"></textarea></div>
</div>
<div class="modal-foot"><button class="btn btn-ghost" onclick="closeModal()">Cancel</button><button class="btn btn-primary" onclick="save()">Save</button></div>
</div></div>`;

async function load() {
  document.getElementById('tbody').innerHTML = '<tr><td colspan="7" class="loading-row"><span class="spinner"></span></td></tr>';
  try {
    const d = await adminApi.getSubscriptionPlans();
    items = (d.plans || d.items || []).sort((a,b)=>(a.sortOrder||99)-(b.sortOrder||99));
    render();
  } catch(e) { showToast(e.message, 'error'); }
}

function render() {
  const q = (document.getElementById('srch').value||'').toLowerCase();
  const f = items.filter(i => !q || JSON.stringify(i).toLowerCase().includes(q));
  document.getElementById('cnt').textContent = `${f.length} plans`;
  document.getElementById('tbody').innerHTML = f.map(i => `<tr>
    <td class="mono">${i.sortOrder??'–'}</td>
    <td class="mono" style="font-size:12px">${escapeHtml(i.planId||'')}</td>
    <td><b>${escapeHtml(i.planName||'')}</b></td>
    <td style="font-size:12px">${escapeHtml(i.frequencyLabel||'')}</td>
    <td class="mono">${i.durationDays??'–'} days</td>
    <td><span class="pill ${i.isActive?'pill-active':'pill-inactive'}">${i.isActive?'Yes':'No'}</span></td>
    <td>
      <button class="btn btn-ghost btn-sm" onclick='openModal(${JSON.stringify(i)})'>Edit</button>
      <button class="btn btn-danger btn-sm" onclick="del('${i._id}')">Del</button>
    </td>
  </tr>`).join('') || '<tr><td colspan="7" class="empty">No delivery plans found.</td></tr>';
}

function openModal(i) {
  editId = i ? i._id : null;
  document.getElementById('mTitle').textContent = i ? 'Edit Delivery Plan' : 'Add Delivery Plan';
  document.getElementById('fPlanId').value        = i?.planId || '';
  document.getElementById('fPlanName').value      = i?.planName || '';
  document.getElementById('fFrequencyLabel').value= i?.frequencyLabel || '';
  document.getElementById('fDurationDays').value  = i?.durationDays ?? '';
  document.getElementById('fSortOrder').value     = i?.sortOrder ?? '';
  document.getElementById('fIsActive').value      = i?.isActive === false ? 'false' : 'true';
  document.getElementById('fDescription').value   = i?.description || '';
  document.getElementById('modal').style.display = 'flex';
}
function closeModal() { document.getElementById('modal').style.display = 'none'; editId = null; }
function g(id) { const v = document.getElementById(id)?.value; return (v===''||v===undefined) ? null : v; }

async function save() {
  const planId   = g('fPlanId');
  const planName = g('fPlanName');
  if (!planId)   { showToast('Plan ID is required', 'error'); return; }
  if (!planName) { showToast('Plan Name is required', 'error'); return; }
  const body = {
    planId,
    planName,
    frequencyLabel: g('fFrequencyLabel'),
    durationDays:   parseInt(document.getElementById('fDurationDays').value) || null,
    sortOrder:      parseInt(document.getElementById('fSortOrder').value) || 99,
    isActive:       document.getElementById('fIsActive').value === 'true',
    description:    g('fDescription'),
  };
  try {
    if (editId) await adminApi.updateSubscriptionPlan(editId, body);
    else        await adminApi.createSubscriptionPlan(body);
    showToast(editId ? 'Updated' : 'Created', 'success');
    closeModal(); load();
  } catch(e) { showToast(e.message, 'error'); }
}

async function del(id) {
  if (!confirm('Delete this delivery plan? Existing subscriptions on this plan will not be affected.')) return;
  try { await adminApi.deleteSubscriptionPlan(id); showToast('Deleted', 'success'); load(); }
  catch(e) { showToast(e.message, 'error'); }
}
load();
</script></body></html>
