<!DOCTYPE html><html lang="en"><head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Delivery Frequency · KRISHA PURE Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=DM+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="css/admin.css"/>
<style>
.plan-cards { display:grid; grid-template-columns:repeat(auto-fill,minmax(280px,1fr)); gap:14px; margin-bottom:20px; }
.plan-card  { background:#fff; border:1.5px solid var(--border); border-radius:14px; padding:20px; display:flex; flex-direction:column; gap:10px; transition:box-shadow .15s; }
.plan-card:hover { box-shadow:0 4px 14px rgba(0,0,0,.07); border-color:var(--green); }
.plan-card.inactive { opacity:.5; }
.plan-card-name  { font-size:15px; font-weight:700; color:var(--ink); }
.plan-card-freq  { font-size:12px; color:var(--green-dark); font-weight:600; background:var(--green-pale); display:inline-block; padding:2px 10px; border-radius:20px; }
.plan-card-desc  { font-size:12.5px; color:var(--ink-soft); line-height:1.5; }
.plan-card-meta  { font-size:11px; color:var(--ink-faint); font-family:var(--font-mono); }
.plan-card-foot  { display:flex; gap:8px; margin-top:4px; }
.plan-add-card   { border:2px dashed var(--border); border-radius:14px; padding:20px; display:flex; align-items:center; justify-content:center; gap:8px; cursor:pointer; color:var(--ink-faint); font-size:13.5px; font-weight:600; transition:border-color .15s,color .15s; background:none; min-height:120px; }
.plan-add-card:hover { border-color:var(--green); color:var(--green); }
.info-note { background:#FFF8E1; border:1px solid #F0DDA0; color:#7A5A0A; font-size:12.5px; padding:10px 14px; border-radius:10px; margin-bottom:18px; line-height:1.6; }
</style>
</head><body>
<script src="js/api.js"></script>
<script>Auth.guardMenu('subscription-plans');</script>
<script src="js/sidebar.js"></script>
<script>
const content = renderShell({
  active: 'subscription-plans',
  title:  'Delivery Frequency',
  sub:    'Configure delivery frequency options shown to customers — Weekly, Alternate Days, Monthly, etc.',
  actions: `<button class="btn btn-primary" onclick="openModal()">+ Add Plan</button>`,
});

let items = [], editId = null;

content.innerHTML = `
<div class="info-note">
  ℹ️ These options define <b>how often</b> a customer receives their basket — not pricing.
  Basket price is calculated from the products in each member's personalised basket.
  Customers pick one of these during setup and can change it anytime.
</div>
<div id="cards"></div>

<div class="modal-backdrop" id="modal" style="display:none" onclick="if(event.target===this)closeModal()">
<div class="modal" style="max-width:460px">
  <div class="modal-head"><h3 id="mTitle">Add Delivery Plan</h3><button class="modal-close" onclick="closeModal()">✕</button></div>
  <div class="form-grid" style="padding:4px 0 8px">
    <div class="field full">
      <label>Plan Name * <span class="opt">(shown to customer)</span></label>
      <input id="fName" placeholder="e.g. Weekly Plan"/>
    </div>
    <div class="field full">
      <label>Frequency Label <span class="opt">(short tag shown on card)</span></label>
      <input id="fFreq" placeholder="e.g. Every 7 days, Alternate Days, Monthly"/>
    </div>
    <div class="field full">
      <label>Description <span class="opt">(optional subtitle)</span></label>
      <input id="fDesc" placeholder="e.g. Fresh basket delivered every week"/>
    </div>
    <div class="field">
      <label>Duration (days) * <span class="opt">(cycle length)</span></label>
      <input id="fDays" type="number" min="1" placeholder="7"/>
    </div>
    <div class="field">
      <label>Sort Order <span class="opt">(display order)</span></label>
      <input id="fSort" type="number" min="1" placeholder="1"/>
    </div>
    <div class="field">
      <label>Plan ID <span class="opt">(auto if blank)</span></label>
      <input id="fPlanId" placeholder="e.g. weekly"/>
    </div>
    <div class="field">
      <label>Active</label>
      <select id="fActive"><option value="true">Yes</option><option value="false">No</option></select>
    </div>
  </div>
  <div class="modal-foot">
    <button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
    <button class="btn btn-primary" onclick="save()">Save Plan</button>
  </div>
</div></div>
`;

async function load() {
  document.getElementById('cards').innerHTML = `<div style="padding:30px;text-align:center"><span class="spinner"></span></div>`;
  try {
    const d = await adminApi.getSubscriptionPlans();
    items = d.plans || [];
    render();
  } catch(e) { showToast(e.message, 'error'); }
}

function render() {
  const cards = items.map(p => `
    <div class="plan-card ${p.isActive === false ? 'inactive' : ''}">
      <div>
        <div class="plan-card-name">${escapeHtml(p.planName)}</div>
        ${p.frequencyLabel ? `<span class="plan-card-freq">${escapeHtml(p.frequencyLabel)}</span>` : ''}
      </div>
      ${p.description ? `<div class="plan-card-desc">${escapeHtml(p.description)}</div>` : ''}
      <div class="plan-card-meta">
        ${p.durationDays} day cycle · Sort: ${p.sortOrder ?? '–'}
        <span class="pill ${p.isActive === false ? 'pill-inactive' : 'pill-active'}" style="margin-left:8px;font-size:10px">
          ${p.isActive === false ? 'Inactive' : 'Active'}
        </span>
      </div>
      <div class="plan-card-foot">
        <button class="btn btn-ghost btn-sm" onclick='openModal(${JSON.stringify(p)})'>Edit</button>
        <button class="btn btn-ghost btn-sm" style="color:var(--red)"
          onclick="deactivate('${p._id}','${escapeHtml(p.planName)}')">
          ${p.isActive === false ? 'Activate' : 'Deactivate'}
        </button>
        <button class="btn btn-ghost btn-sm" style="color:#8B0000;font-weight:700"
          onclick="hardDel('${p._id}','${escapeHtml(p.planName)}')">Delete</button>
      </div>
    </div>
  `).join('');

  document.getElementById('cards').innerHTML = `
    <div class="plan-cards">
      ${cards}
      <button class="plan-add-card" onclick="openModal()"><span style="font-size:20px">+</span> Add Plan</button>
    </div>
    ${items.length === 0 ? '<div class="empty"><div class="icon">📅</div>No delivery plans yet. Add your first one.</div>' : ''}
  `;
}

function openModal(p) {
  editId = p ? p._id : null;
  document.getElementById('mTitle').textContent = p ? 'Edit Delivery Plan' : 'Add Delivery Plan';
  document.getElementById('fName').value   = p?.planName       || '';
  document.getElementById('fFreq').value   = p?.frequencyLabel || '';
  document.getElementById('fDesc').value   = p?.description    || '';
  document.getElementById('fDays').value   = p?.durationDays   || '';
  document.getElementById('fSort').value   = p?.sortOrder      ?? (items.length + 1);
  document.getElementById('fPlanId').value = p?.planId         || '';
  document.getElementById('fActive').value = p?.isActive === false ? 'false' : 'true';
  document.getElementById('modal').style.display = 'flex';
  document.getElementById('fName').focus();
}

function closeModal() { document.getElementById('modal').style.display = 'none'; editId = null; }

function g(id) { const v = document.getElementById(id)?.value?.trim(); return v === '' ? null : v; }

async function save() {
  const planName    = g('fName');
  const durationDays = parseInt(document.getElementById('fDays').value);
  if (!planName)       { showToast('Plan name is required', 'error'); return; }
  if (!durationDays)   { showToast('Duration days is required', 'error'); return; }

  const body = {
    planName,
    frequencyLabel: g('fFreq') || planName,
    description:    g('fDesc'),
    durationDays,
    sortOrder:      parseInt(document.getElementById('fSort').value) || 99,
    planId:         g('fPlanId'),
    isActive:       document.getElementById('fActive').value === 'true',
  };

  try {
    if (editId) await adminApi.updateSubscriptionPlan(editId, body);
    else        await adminApi.createSubscriptionPlan(body);
    showToast(editId ? 'Plan updated ✓' : 'Plan created ✓', 'success');
    closeModal(); load();
  } catch(e) { showToast(e.message, 'error'); }
}

async function deactivate(id, name) {
  const p = items.find(x => x._id === id);
  const activate = p?.isActive === false;
  if (!confirm(`${activate ? 'Activate' : 'Deactivate'} "${name}"?`)) return;
  try {
    await adminApi.updateSubscriptionPlan(id, { isActive: activate });
    showToast(activate ? 'Plan activated' : 'Plan deactivated', 'success');
    load();
  } catch(e) { showToast(e.message, 'error'); }
}

async function hardDel(id, name) {
  if (!confirm(`Permanently delete "${name}"? This cannot be undone.`)) return;
  try {
    await adminApi.hardDeleteSubscriptionPlan(id);
    showToast('Plan deleted', 'success');
    load();
  } catch(e) { showToast(e.message, 'error'); }
}

load();
</script>
</body></html>
