<!DOCTYPE html><html lang="en"><head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Wellness Goals · KRISHA PURE Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=DM+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="css/admin.css"/>
</head><body>
<script src="js/api.js"></script><script>Auth.guardMenu('wellness-goals');</script>
<script src="js/sidebar.js"></script>
<script>
const content = renderShell({
  active: 'wellness-goals',
  title: 'Wellness Goals',
  sub: 'Goal definitions used by the basket engine for product scoring and goal suggestion',
  actions: `<button class="btn btn-primary" onclick="openModal()">+ Add Goal</button>`
});

let items = [], editId = null;

const CATS = ['Wellness','Weight','Fitness','Therapeutic','Clinical','Women','Sports','Senior','Child'];
const SCORE_FIELDS = [
  'immunity','weightLoss','diabetes','detox','satiety','antiInflammatory',
  'hypertension','weightGain','generalWellness','buildMuscle','heartHealth',
  'pregnancy','lactation','ironSupport','boneHealth','fattyLiver',
  'healthyAgeing','pcos','thyroidSupport','sportsNutrition'
];

content.innerHTML = `
<div class="panel">
  <div class="toolbar">
    <input type="search" id="srch" placeholder="Search goals…" oninput="render()"/>
    <div class="spacer"></div>
    <span id="cnt" class="muted" style="font-size:12px"></span>
  </div>
  <div class="table-wrap"><table class="data">
    <thead><tr>
      <th>Code</th><th>Display Name</th><th>Category</th><th>Age Range</th>
      <th>Gender</th><th>Score Field</th><th>Clinical Review</th><th>Status</th><th></th>
    </tr></thead>
    <tbody id="tbody"></tbody>
  </table></div>
</div>

<div class="modal-backdrop" id="modal" style="display:none" onclick="if(event.target===this)closeModal()">
<div class="modal wide"><div class="modal-head"><h3 id="mTitle">Add Wellness Goal</h3><button class="modal-close" onclick="closeModal()">✕</button></div>
<div style="overflow-y:auto;max-height:68vh"><div class="form-grid">

  <div class="field"><label>Goal Code <span class="opt">e.g. WG001</span></label><input id="fGoalCode" placeholder="WG001"/></div>
  <div class="field"><label>Display Name *</label><input id="fDisplayName" placeholder="General Wellness"/></div>
  <div class="field"><label>Goal Name <span class="opt">short internal label</span></label><input id="fGoalName" placeholder="MNT"/></div>
  <div class="field"><label>Category</label><select id="fCategory">${CATS.map(c=>`<option>${c}</option>`).join('')}</select></div>

  <div class="field full"><label>Description</label><textarea id="fDescription" rows="2" placeholder="Disease specific nutrition…"></textarea></div>

  <div class="field"><label>Eligible Age Min</label><input id="fEligibleAgeMin" type="number" min="0" max="120" placeholder="0"/></div>
  <div class="field"><label>Eligible Age Max</label><input id="fEligibleAgeMax" type="number" min="0" max="120" placeholder="120"/></div>
  <div class="field"><label>Gender Applicable</label><select id="fGenderApplicable"><option>All</option><option>Female</option><option>Male</option></select></div>
  <div class="field"><label>Priority <span class="opt">numeric, lower = higher priority</span></label><input id="fPriority" type="number" min="1" placeholder="1"/></div>

  <div class="field"><label>Product Score Field *</label>
    <select id="fProductScoreField">${SCORE_FIELDS.map(s=>`<option value="${s}">${s}</option>`).join('')}</select>
  </div>
  <div class="field"><label>Auto Apply</label><select id="fAutoApply"><option>Yes</option><option>No</option><option>Conditional</option></select></div>
  <div class="field"><label>Auto Calculation</label><select id="fAutoCalculation"><option>Yes</option><option>No</option><option>Conditional</option></select></div>
  <div class="field"><label>Clinical Review Required</label><select id="fClinicalReviewRequired"><option>No</option><option>Yes</option><option>Conditional</option></select></div>

  <div class="field"><label>Recommended Basket <span class="opt">e.g. CB001</span></label><input id="fRecommendedBasket" placeholder="CB001"/></div>
  <div class="field"><label>Default Activity Level <span class="opt">e.g. ACT003</span></label><input id="fDefaultActivityLevel" placeholder="ACT003"/></div>
  <div class="field"><label>Mandatory Review Trigger</label><input id="fMandatoryReviewTrigger" placeholder="BMI≥30"/></div>
  <div class="field"><label>Reference Guideline</label><input id="fReferenceGuideline" placeholder="ICMR / ESPEN / WHO"/></div>

  <div class="field"><label>Rule Status</label><select id="fRuleStatus"><option>Approved</option><option>Pending</option><option>Inactive</option></select></div>
  <div class="field"><label>Nutritionist Approved</label><select id="fNutritionistApproved"><option value="Yes">Yes</option><option value="No">No</option></select></div>
  <div class="field"><label>Active</label><select id="fIsActive"><option value="true">Yes</option><option value="false">No</option></select></div>

  <div class="field full"><label>Nutritionist Comments <span class="opt">(internal)</span></label><textarea id="fNutritionistComments" rows="2"></textarea></div>

</div></div>
<div class="modal-foot"><button class="btn btn-ghost" onclick="closeModal()">Cancel</button><button class="btn btn-primary" onclick="save()">Save</button></div>
</div></div>`;

async function load() {
  document.getElementById('tbody').innerHTML = '<tr><td colspan="9" class="loading-row"><span class="spinner"></span></td></tr>';
  try {
    const d = await adminApi.getWellnessGoals();
    items = (d.goals || d.items || []).sort((a,b) => (a.priority||99) - (b.priority||99));
    render();
  } catch(e) { showToast(e.message, 'error'); }
}

function render() {
  const q = (document.getElementById('srch').value || '').toLowerCase();
  const f = items.filter(i => !q || JSON.stringify(i).toLowerCase().includes(q));
  document.getElementById('cnt').textContent = `${f.length} goals`;
  document.getElementById('tbody').innerHTML = f.map(i => `<tr>
    <td class="mono"><b>${escapeHtml(i.goalCode||'')}</b></td>
    <td>${escapeHtml(i.displayName||'')}</td>
    <td>${escapeHtml(i.category||'')}</td>
    <td class="mono" style="font-size:12px">${i.eligibleAgeMin??0}–${i.eligibleAgeMax??120}</td>
    <td style="font-size:12px">${escapeHtml(i.genderApplicable||'')}</td>
    <td><span class="formula-badge" style="background:#e8f5e9;color:#2e7d32;border-radius:4px;padding:2px 7px;font-size:11px;font-family:monospace">${escapeHtml(i.productScoreField||'–')}</span></td>
    <td><span class="pill ${i.clinicalReviewRequired==='Yes'?'pill-warn':i.clinicalReviewRequired==='Conditional'?'pill-placed':'pill-inactive'}">${escapeHtml(i.clinicalReviewRequired||'No')}</span></td>
    <td><span class="pill ${i.isActive?'pill-active':'pill-inactive'}">${i.isActive?'Active':'Inactive'}</span></td>
    <td>
      <button class="btn btn-ghost btn-sm" onclick='openModal(${JSON.stringify(i)})'>Edit</button>
      <button class="btn btn-danger btn-sm" onclick="del('${i._id}')">Del</button>
    </td>
  </tr>`).join('') || '<tr><td colspan="9" class="empty">No wellness goals found.</td></tr>';
}

function openModal(i) {
  editId = i ? i._id : null;
  document.getElementById('mTitle').textContent = i ? 'Edit Wellness Goal' : 'Add Wellness Goal';
  document.getElementById('fGoalCode').value               = i?.goalCode || '';
  document.getElementById('fDisplayName').value            = i?.displayName || '';
  document.getElementById('fGoalName').value               = i?.goalName || '';
  document.getElementById('fCategory').value               = i?.category || CATS[0];
  document.getElementById('fDescription').value            = i?.description || '';
  document.getElementById('fEligibleAgeMin').value         = i?.eligibleAgeMin ?? 0;
  document.getElementById('fEligibleAgeMax').value         = i?.eligibleAgeMax ?? 120;
  document.getElementById('fGenderApplicable').value       = i?.genderApplicable || 'All';
  document.getElementById('fPriority').value               = i?.priority ?? '';
  document.getElementById('fProductScoreField').value      = i?.productScoreField || SCORE_FIELDS[0];
  document.getElementById('fAutoApply').value              = i?.autoApply || 'Yes';
  document.getElementById('fAutoCalculation').value        = i?.autoCalculation || 'Yes';
  document.getElementById('fClinicalReviewRequired').value = i?.clinicalReviewRequired || 'No';
  document.getElementById('fRecommendedBasket').value      = i?.recommendedBasket || '';
  document.getElementById('fDefaultActivityLevel').value   = i?.defaultActivityLevel || '';
  document.getElementById('fMandatoryReviewTrigger').value = i?.mandatoryReviewTrigger || '';
  document.getElementById('fReferenceGuideline').value     = i?.referenceGuideline || '';
  document.getElementById('fRuleStatus').value             = i?.ruleStatus || 'Approved';
  document.getElementById('fNutritionistApproved').value   = i?.nutritionistApproved || 'Yes';
  document.getElementById('fIsActive').value               = i?.isActive === false ? 'false' : 'true';
  document.getElementById('fNutritionistComments').value   = i?.nutritionistComments || '';
  document.getElementById('modal').style.display = 'flex';
}

function closeModal() { document.getElementById('modal').style.display = 'none'; editId = null; }
function g(id) { const v = document.getElementById(id)?.value; return (v===''||v===undefined) ? null : v; }

async function save() {
  const displayName = g('fDisplayName');
  if (!displayName) { showToast('Display Name is required', 'error'); return; }
  const body = {
    goalCode:               g('fGoalCode'),
    displayName,
    goalName:               g('fGoalName'),
    category:               g('fCategory'),
    description:            g('fDescription'),
    eligibleAgeMin:         parseInt(document.getElementById('fEligibleAgeMin').value) || 0,
    eligibleAgeMax:         parseInt(document.getElementById('fEligibleAgeMax').value) || 120,
    genderApplicable:       g('fGenderApplicable'),
    priority:               parseInt(document.getElementById('fPriority').value) || null,
    productScoreField:      g('fProductScoreField'),
    autoApply:              g('fAutoApply'),
    autoCalculation:        g('fAutoCalculation'),
    clinicalReviewRequired: g('fClinicalReviewRequired'),
    recommendedBasket:      g('fRecommendedBasket'),
    defaultActivityLevel:   g('fDefaultActivityLevel'),
    mandatoryReviewTrigger: g('fMandatoryReviewTrigger'),
    referenceGuideline:     g('fReferenceGuideline'),
    ruleStatus:             g('fRuleStatus'),
    nutritionistApproved:   g('fNutritionistApproved'),
    isActive:               document.getElementById('fIsActive').value === 'true',
    nutritionistComments:   g('fNutritionistComments'),
  };
  try {
    if (editId) await adminApi.updateWellnessGoal(editId, body);
    else        await adminApi.createWellnessGoal(body);
    showToast(editId ? 'Goal updated' : 'Goal created', 'success');
    closeModal(); load();
  } catch(e) { showToast(e.message, 'error'); }
}

async function del(id) {
  if (!confirm('Delete this wellness goal? The basket engine will no longer use it.')) return;
  try { await adminApi.deleteWellnessGoal(id); showToast('Deleted', 'success'); load(); }
  catch(e) { showToast(e.message, 'error'); }
}

load();
</script></body></html>
